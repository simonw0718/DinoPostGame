# 小空果果店（取代訂單木箱 v1；導演 11-08：v1 機制不清、沒遊戲性 → 客人點單）
# 讀者：AI；導演版＝art-source/orchard/shop_board.jpg（三種版面草圖，tools/orchard_shop_layouts.py）
status: concept_draft        # 11-08 導演：不被上一版卡住、獨立設計 → 見 concepts_v2（fshop_board.jpg）
story: 小空、圓圓玩扮家家酒開果果店；伊奇、飛飛、小雞阿暴、派洛、奶奶等輪流當客人；玩家是幫手
references: [Moose Math 果汁攤, Endless Numbers, Count Your Chickens, Zingo, 十格框]   # 依據 math_games_survey.yaml
principles:
  P1 自動數: 每放一顆就唸一個數＋十格果盤亮一格；不再有「點箱數數」步驟
  P2 角色在等: 客人泡泡＝大數字＋果子圖；剛好→開心吃／跳舞；太多→撐到打嗝（好笑不扣分）；太少→指著空格等
  P3 小挑戰: 挑對果子；湊剛好；之後一次拿一串 5 顆（看 5 與 10）
  P4 結果看得見: 每送走一位客人，店面多一樣裝飾（彩旗→燈→招牌亮）；收店時數今天來了幾位
  P5 一眼看差: 十格果盤 2×5（kidgame_orchard tray），空格＝還差幾
  keep: [不計時, 不扣分, 不打叉, 三級難度沿用 orchard_crate_modes.yaml 的數學內容]
layouts:
  A 櫃台對面: 客人在桌後點單，果盤在中間，前景三箱果子（拖／點）；最清楚，AI 推薦
  B 排隊小攤: 側面攤位，客人從右邊排隊走來；看得到「還有幾位」，畫面較擠
  C 果樹下直接摘: 點樹上果子直接飛進果盤；不用拖、最簡單，保留果樹
open_questions: [選哪個版面, 小空／圓圓分工（老闆／店員）, 太多時的反應是否 OK]
concepts_v2:                  # tools/fruit_shop_concepts.py → art-source/orchard/fshop_board.jpg；不用果盤／木箱
  A 果果串: {verb: 點碗→果子滑上竹籤, math: 橫向數線、第 5／10 格竹節, payoff: 客人咬一口串串, ext: 兩種果子＝前段＋後段}
  B 果果塔: {verb: 點果子→疊上杯, math: 高度＝數量、身高尺＋客人旗子, tension: 越高越搖（不倒）, payoff: 插旗交給客人}
  C 彩虹果汁: {verb: 點果子→倒進杯變一層, math: 一層一顆、兩色＝加法 3＋2, payoff: 插吸管喝光, ai_pick: true}
director_11_09:               # 導演回覆 fshop_board：方向改「果籃裝盒」，下一版依此重畫
  naming: 不用「串串」（太支那語），用「果籃」
  mechanic: 不用果樹；櫃台前三個大果籃（三種果子），點果籃→果子裝進客人的小盒子
  numbers: 最終要到雙位數（起點 1–10，逐級到 11–20 以上）
  ai_draft_for_next:          # 未經導演核准，下一棒先出版面草圖再問
    box: 小盒＝十格（2×5）；滿 10 蓋蓋子變「一盒＝10」，雙位數＝幾盒＋幾顆（例 23＝2 盒＋3 顆）
    levels: [1–10 單種, 1–10 兩種湊（3＋2）, 11–20 一盒＋散顆, 20–50 多盒＋散顆]
    keep: [每放一顆自動唸數, 客人泡泡＝大數字＋果子圖, 不計時不打叉, 太多可點盒子退回一顆]
director_11_09_v4:            # 導演核准近景版 fclose_board.jpg（tools/fruit_closeup_layout.py）
  camera: 近景；客人只露頭肩在後景，表情跟著反應（每顆點頭、剛好開心、太多歪頭）
  xiaokong: 角落探頭；不畫伸進來的長翅膀，改用滑鼠游標樣式的小翅膀（可用 CF 或 Gemini 製作）或乾脆不用
  grid: ① 十格不進位 ② 二十格進位（第一盒滿 10 蓋蓋貼 10，剩下進第二盒）③ 蓋好的盒縮小疊旁＋二十格
  equation: 算式條 [a]+[b]=[?]；紅果、紫果各自編號；進位時多一行黃色提示「8＋2＝10，再＋3＝13」
  answer: ① 自動填答並唸出 ②③ 放完後三選一
  layout: 手機二十格上下疊；平板左右並排，盒子放大填滿櫃台上方空白，③ 蓋好的盒疊在那裡
  next: 可玩 sample（改寫 dist/orchard.html v1）
