meta:
  created: 2026-11-12
  purpose: "調查乘法遊戲／教具／研究的機制類型，供大班（5–6 歲）從零開始的乘法新遊戲設計。階段對應 math_sequence.yaml M15；通用機制另見 math_games_survey.yaml。"
  method: "WebSearch 2026-11-12；evidence 只寫搜尋結果看得到的；查不到標 verified: false。"
  director_request: "2026-11-12：不沿用既有遊戲，要創造新遊戲模式；先 survey 再規劃。"
  caveat: "多為廠商／部落格／二手整理；Clements & Sarama 軌跡的年齡未查到原文。"

trajectory:   # 乘除學習軌跡（來源 X09，無年齡）
  - {id: T1, name: 具體操作等組, can: "做出等組全部數一遍；除法用一個一個發"}
  - {id: T2, name: 等組的部分與整體, can: "把等組看成『n 倍』；分越多份每份越少"}
  - {id: T3, name: 跳數, can: "重複加、翻倍、跳數"}
  - {id: T4, name: 推導事實, can: "用已知推未知（9＝10−1）"}
  - {id: T5, name: 陣列／靈活解題, can: "用已知組合解各類乘除題"}
  - {id: T6, name: 倍數比較, can: "幾倍的比較"}
trajectory_note: "大班目標＝T1–T3；T4 以後留小一小二。"

mechanics:
  - id: X01
    family: 做等組（畫圈放星）
    examples: ["Circles and Stars（Marilyn Burns）", "CGI 直接建模"]
    how: "骰一次決定幾組、再骰決定每組幾個，做出來數總數。"
    age_fit: 高
    borrow: "『幾組』『每組幾個』分兩步決定；孩子自己造出來。"
    evidence: "幼兒園孩子能用直接建模解簡單乘除文字題（Carpenter 等，二手引用，來源 X10）；Circles and Stars 規則未查到 verified: false。"
  - id: X02
    family: 平分／發牌
    examples: ["一個一個發（dealing）"]
    how: "把一堆東西輪流發給幾個對象，發完每份一樣多。"
    age_fit: 高
    borrow: "4–5 歲已會一對一輪流分（來源 X10）；是除法也是乘法的入口。"
    avoid: "孩子常忽略『幾個對象』，畫面要讓對象數很明顯。"
  - id: X03
    family: 跳數鏈／數線跳
    examples: ["Montessori 短珠鏈", "SplashLearn 跳數找路"]
    how: "每 n 顆一段的珠鏈，數到每段尾巴放箭頭標籤；或數線上一次跳 n 格。"
    age_fit: 高（2、5、10）；中（3、4）
    borrow: "一段＝一個單位、顏色區分；跳 5 次到 10＝2×5（來源 X05）。Montessori 短鏈 4.5–5 歲。"
  - id: X04
    family: 陣列／長方形
    examples: ["Numberblocks 長方形（How Rectangly!、Rectangle Racers、Fun Times Fair）", "Montessori 乘法珠板", "youcubed How Close to 100"]
    how: "排成幾排×每排幾個；同一個數可以排出不同長方形；骰兩數畫陣列填滿百格。"
    age_fit: 中高（到 5×5）
    borrow: "角色自己變形成長方形（Numberblocks）；珠板 5–8 歲、大班後段可（來源 X06）；百格填陣列＝空間策略＋乘法（來源 X07）。"
    avoid: "要先會數到 100、有跳數經驗才上珠板。"
  - id: X05
    family: 視覺閃卡＋間隔重複
    examples: ["Multiplication by Heart（Math for Love／Amplify）"]
    how: "三種圖：圈裡的點（到 5×5）、陣列（到 10×10）、質因數圈；答對往後盒、答錯回 A 盒，每天約 5 分鐘。"
    age_fit: 低（要讀數字）；圖像可借
    borrow: "熟的少出、不熟的多出；每張卡都有『看得懂的圖』。"
  - id: X06
    family: 計時競速答題
    examples: ["Times Tables Rock Stars"]
    how: "限時答題，平均秒數決定搖滾等級。"
    age_fit: 不適合
    avoid: "沒有正式成效研究（2024 學術評論，來源 X08）；計時壓力會擋住工作記憶、三分之一以上學生對計時測驗極度緊張（Boaler 引用，來源 X03）。"
  - id: X07
    family: 小遊戲集合
    examples: ["Kahoot! Multiplication by DragonBox（20 個小遊戲）"]
    how: "多個小遊戲＋單一乘法表訓練模式，自動調整難度。"
    age_fit: 低（標示 7+／9+）
    avoid: "家長評論：其實像數位閃卡、沒先教概念就考（來源 X04）。"
  - id: X08
    family: 顏色因數棋盤
    examples: ["Prime Climb"]
    how: "每個質數一個顏色（2 橘、3 綠、5 藍、7 紫），數字的顏色組合＝因數。"
    age_fit: 低（8+）
    borrow: "顏色＝『幾個一組』的身分，可用在印章／腳印顏色。"
  - id: X09
    family: 口訣／節奏
    examples: ["九九乘法口訣", "跳數歌"]
    how: "用唸、唱、拍記住。"
    age_fit: 中（會唸不等於懂）
    evidence: "本次未查，verified: false；Boaler 不反對練習，反對沒理解的死背（來源 X03）。"

principles:
  - "先懂『每份一樣多』再給算式；符號 × 最後才出現。"
  - "順序：2、5、10 → 3、4 → 6–9 用翻倍／已知推未知。"
  - "不計時、不排名；進度用『收集』呈現。"
  - "線性、越右越大的排列有最強證據（math_games_survey G01）。"

sources:
  X03: "https://ed.stanford.edu/news/learning-math-without-fear ; https://hechingerreport.org/should-we-stop-making-kids-memorize-times-tables/"
  X04: "https://apps.apple.com/us/app/id1588092224 ; https://kahoot.com/press/2022/02/17/kahoot-multiplication-by-dragonbox/"
  X05: "https://www.nienhuis.com/us/product/short-bead-chains-individual-beads-glass/500_0080G0 ; https://www.montessorialbum.com/montessori/index.php/Short_Chains"
  X06: "https://montessorimom.com/lesson-day-78-multiplication-bead-board/"
  X07: "https://www.youcubed.org/task/how-to-close-100/"
  X08: "https://blog.soton.ac.uk/edpsych/?p=1410"
  X09: "https://sites.google.com/view/bridgingmathstrength/lt/multiplicative-reasoning-lt"
  X10: "https://link.springer.com/10.1007/s13394-022-00413-1 ; https://merga.net.au/wp-content/uploads/DOCS/common/Uploaded%20files/Annual%20Conference%20Proceedings/2008%20Annual%20Conference%20Proceedings/Downton%20RP172008.pdf"
  X11: "https://mathforlove.com/prime-climb/ ; https://mathforlove.com/wp-content/uploads/2021/12/MBH-Instructions-final-10.26.21.pdf"

