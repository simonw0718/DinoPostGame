dice_field:   # 2026-11-12 導演：v2 訂單版「還是不太行」→ 問知名遊戲做法 →「骰子版作看看」
  id: MV5
  name: 骰子花田
  status: sample_v1_20261112
  files: [dist/field.html, dist/field.js, dist/field.css]
  based_on: [X04, X01]
  fun_source: "運氣（骰子）＋擺哪裡的空間選擇＋和奶奶輪流合作種滿；沒有對錯。"
  multiplication_exposure: "骰子→花毯一條條疊出來時算式跟著跳（3×1=3…3×4=12）；轉方向算式變 4×3=12；種下去時花毯上再閃一次。"
  lesson_from_v2: "訂單版只有照做、答案唯一，導演判定沒有遊戲性；知名遊戲的好玩來源都在乘法之外（運氣、空間、對手、收集）。"
  unverified: "大班孩子是否覺得『擺哪裡』有趣，未實測。"

