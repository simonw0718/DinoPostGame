<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>恐龍蛋快打・巢分布 sample</title>
<!-- 導演 2026-10-27：維持 5 巢、固定一組自然分布、高度範圍拉大約 1.5 倍；本頁只比較分布，不是正式頁 -->
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0;padding:18px;background:#0e3a28;color:#fff;font:600 16px/1.4 "Naikai",ui-rounded,system-ui,sans-serif}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 14px;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:26px;align-items:flex-start}
figure{margin:0}figcaption{margin:6px 2px 0;font-size:18px}figcaption small{opacity:.7;margin-left:6px}
.stage{position:relative;overflow:hidden;border:5px solid #fff7df;border-radius:22px;background:#c5e59a url(assets/egg/meadow.webp) 50% 100%/cover no-repeat}
.land{width:560px;height:260px}.port{width:300px;height:350px}
.spot{position:absolute;width:var(--s);height:calc(var(--s)*1.3);translate:-50% -100%}
.nest,.rim{position:absolute;left:-28%;right:-28%;bottom:calc(var(--s)*-.25);height:calc(var(--s)*1.24);background:center/100% 100% no-repeat}
.nest{background-image:url(assets/egg/nest.webp)}.rim{z-index:4;background-image:url(assets/egg/nest_front.webp)}
.egg{position:absolute;left:8%;right:8%;bottom:8%;height:86%;z-index:2;background:url(assets/egg/egg.webp) 50% 100%/contain no-repeat}
.pop{position:absolute;left:50%;bottom:62%;z-index:3;width:74%;aspect-ratio:1;translate:-50% 0;border:3px solid #ead9b2;border-radius:16%;background:#fffef8 url(assets/egg/egg.webp) center/0 no-repeat;box-shadow:0 3px 0 #c9ad78;display:grid;place-items:center;color:#c98a3e;font-size:calc(var(--s)*.22)}
.tag{position:absolute;right:8px;top:6px;z-index:200;padding:2px 10px;border-radius:999px;background:#0e3a28cc;font-size:15px}
</style></head><body>
<h1>恐龍蛋快打：5 個巢的分布 sample</h1>
<p>每種都附橫式＋直式。最前面的巢跳出一張圖卡（虛線框），用來看會不會被擋住。比例照實際畫面：橫式 1250×580、直式 770×900。</p>
<div id="out"></div>
<script>
// [x, y] = 巢底部位置（畫面比例）；大小依 y 算近大遠小
const L = {
  '現在（對照）': { land: [[.34,.52],[.66,.52],[.2,.84],[.5,.84],[.8,.84]], port: [[.34,.52],[.66,.52],[.2,.84],[.5,.84],[.8,.84]], fixedK: true },
  'A 自然散落': { land: [[.16,.86],[.44,.72],[.74,.88],[.86,.58],[.3,.52]], port: [[.27,.9],[.73,.8],[.36,.66],[.74,.56],[.3,.48]] },
  'B 微笑弧線': { land: [[.12,.58],[.3,.75],[.5,.88],[.7,.75],[.88,.58]], port: [[.27,.5],[.73,.5],[.24,.7],[.76,.7],[.5,.9]] },
  'C 前三後二錯落': { land: [[.17,.86],[.5,.88],[.83,.84],[.34,.6],[.67,.55]], port: [[.5,.48],[.25,.66],[.75,.68],[.28,.88],[.72,.9]] },
  'D 斜坡 Z 字': { land: [[.13,.88],[.38,.74],[.62,.88],[.86,.72],[.6,.53]], port: [[.7,.47],[.3,.58],[.7,.7],[.3,.8],[.64,.92]] },
};
const REAL = { land: [1250, 580], port: [770, 900] };
const out = document.getElementById('out');
for (const [name, cfg] of Object.entries(L)) {
  const row = document.createElement('div'); row.className = 'row';
  for (const mode of ['land', 'port']) {
    const fig = document.createElement('figure');
    const st = document.createElement('div'); st.className = `stage ${mode}`;
    fig.append(st);
    const cap = document.createElement('figcaption'); cap.innerHTML = `${name}<small>${mode === 'land' ? '橫式' : '直式'}</small>`; fig.append(cap);
    row.append(fig); out.append(row);
    const W = st.clientWidth, H = st.clientHeight, [RW, RH] = REAL[mode], view = W / RW;
    // 現在的公式：s = min(W*.24, H*.27, 190)，後排 .74
    let base;
    if (cfg.fixedK) base = Math.min(RW * .24, RH * .27, 190);
    else base = Math.min(RW * (mode === 'land' ? .19 : .27), RH * .36, 240);
    const pts = cfg[mode], ys = pts.map(p => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys);
    let maxS = 0;
    pts.forEach(([x, y], i) => {
      const k = cfg.fixedK ? (y < .7 ? .74 : 1) : .68 + .42 * ((y - y0) / Math.max(.01, y1 - y0));
      const s = base * k * view; maxS = Math.max(maxS, s / view);
      const el = document.createElement('div'); el.className = 'spot';
      el.style.cssText = `left:${x * 100}%;top:${y * 100}%;--s:${s}px;z-index:${Math.round(y * 100)}`;
      el.innerHTML = `<span class="nest"></span><div class="egg"></div><span class="rim"></span>` + (y === y1 && pts.findIndex(p => p[1] === y1) === i ? '<div class="pop">卡</div>' : '');
      st.append(el);
    });
    const now = Math.min(REAL[mode][0] * .24, REAL[mode][1] * .27, 190);
    st.insertAdjacentHTML('beforeend', `<span class="tag">最前巢 ${(maxS / now).toFixed(1)} 倍</span>`);
  }
}
</script>
</body></html>
