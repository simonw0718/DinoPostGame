<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>注音送信・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=20261002c">
  <link rel="stylesheet" href="game-homes.css?v=1">
  <script src="game-homes.js?v=1" defer></script>
</head>
<body data-page="mail">
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <a class="setup-back" href="index.html" aria-label="返回選遊戲首頁">‹ <span>選遊戲</span></a>
      <a class="brand" href="index.html" aria-label="返回選遊戲首頁"><span class="brand-seal" aria-hidden="true"><img src="assets/dinopost-workmark-master.png" alt=""></span><span class="brand-copy"><strong>恐龍郵局</strong><small>WORD MISSION</small></span></a>
      <button id="mailSettingsButton" class="settings-button" type="button" aria-label="開啟送信設定"><span aria-hidden="true">⚙</span><span>設定</span></button>
    </header>
    <section id="startScreen" class="screen start-screen" aria-labelledby="startTitle">
      <div class="start-world" aria-hidden="true"></div>
      <div class="start-sun" aria-hidden="true"></div>
      <div class="start-sticker" aria-hidden="true"><div id="startActorA" class="spotlight-actor"></div></div>
      <div class="start-feifei cast-stamp" aria-hidden="true"><div id="startActorB" class="spotlight-actor"></div></div>
      <div class="start-abao cast-stamp" aria-hidden="true"><div id="startActorC" class="spotlight-actor"></div></div>
      <div class="start-letter">
        <div class="letter-edge" aria-hidden="true"></div>
        <div class="letter-postmark" aria-hidden="true"><img src="assets/dinopost-workmark-master.png" alt=""></div>
        <p class="eyebrow">郵局夥伴送來一封新任務</p>
        <h1 id="startTitle"><span id="startTitleLine1">讀注音，</span><br><em id="startTitleLine2">送信去！</em></h1>
        <p id="startDescription" class="start-description">讀注音，選郵箱。</p>
        <fieldset class="mode-picker"><legend id="modeLegend">選任務</legend><div class="mode-options"><button class="mode-option" type="button" data-mode="all" aria-pressed="true"><span class="mode-icon" aria-hidden="true">✦</span><span class="mode-label">全部</span></button><button class="mode-option" type="button" data-mode="level" aria-pressed="false"><span class="mode-icon" aria-hidden="true">1–3</span><span class="mode-label">分難度</span></button><button class="mode-option" type="button" data-mode="dinosaur" aria-pressed="false"><span class="mode-icon" aria-hidden="true">🦕</span><span class="mode-label">恐龍挑戰</span></button></div></fieldset>
        <div id="levelControl" class="level-control hidden"><label id="levelText" for="levelSlider">第一級</label><input id="levelSlider" type="range" min="1" max="3" step="1" value="1" aria-label="選擇難度等級"><div class="level-marks" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div></div>
        <div class="round-summary"><span class="summary-star" aria-hidden="true">✦</span><span id="roundCountLabel">每回合 <strong id="startCount">5</strong> 封</span><i aria-hidden="true"></i><span id="fourChoicesLabel">每封 3 個郵箱</span></div>
        <button id="startButton" class="primary-button" type="button"><span class="start-label">開始任務</span><span class="button-arrow" aria-hidden="true">➜</span></button>
      </div>
      <div class="start-ground" aria-hidden="true"></div>
    </section>
  </main>
  <dialog id="mailSettingsDialog" class="settings-dialog">
    <div class="dialog-head"><span class="dialog-icon" aria-hidden="true">✉</span><h2>送信設定</h2><button id="mailSettingsClose" class="close-button" type="button" aria-label="關閉設定">✕</button></div>
    <p class="setting-note">每回合 5 封信。任務模式和難度可在首頁選擇；題庫開關和作答紀錄與找圖片共用。</p>
    <a class="settings-link" href="match.html?settings=bank"><span><strong>題庫管理</strong><small>選擇可出現的單字</small></span><span aria-hidden="true">›</span></a>
    <a class="settings-link" href="match.html?settings=history"><span><strong>作答紀錄</strong><small>查看最近 10 回合</small></span><span aria-hidden="true">›</span></a>
  </dialog>
</body>
</html>
