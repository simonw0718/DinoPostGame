<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="description" content="跟著伊奇、飛飛與小雞阿暴在恐龍郵局聽單字、選圖片。">
  <title>恐龍郵局・單字任務</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20260930n">
  <script src="app.js?v=20260930n" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="恐龍郵局單字任務"><span class="brand-seal" aria-hidden="true"><img src="assets/dinopost-workmark-master.png" alt=""></span><span class="brand-copy"><strong>恐龍郵局</strong><small>WORD MISSION</small></span></div>
      <button id="settingsButton" class="settings-button" type="button" aria-label="開啟設定"><span aria-hidden="true">⚙</span><span>設定</span></button>
    </header>

    <section id="startScreen" class="screen start-screen" aria-labelledby="startTitle">
      <div class="start-world" aria-hidden="true"></div>
      <div class="start-sun" aria-hidden="true"></div>
      <div class="start-sticker" aria-hidden="true"><div class="iggy-actor pose-wave"></div></div>
      <div class="start-feifei character-flight" aria-hidden="true"><div class="feifei-actor feifei-fly"></div></div>
      <div class="start-abao" aria-hidden="true"><div class="abao-actor abao-sort"></div></div>
      <div class="start-letter">
        <div class="letter-edge" aria-hidden="true"></div>
        <div class="letter-postmark" aria-hidden="true"><img src="assets/dinopost-workmark-master.png" alt=""></div>
        <p class="eyebrow">郵局夥伴送來一封新任務</p>
        <h1 id="startTitle"><span id="startTitleLine1">聽單字，</span><br><em id="startTitleLine2">找圖片！</em></h1>
        <p id="startDescription" class="start-description">聽英文，選圖片。</p>
        <fieldset class="mode-picker"><legend id="modeLegend">選任務</legend><div class="mode-options"><button class="mode-option" type="button" data-mode="all" aria-pressed="true"><span class="mode-icon" aria-hidden="true">✦</span><span class="mode-label">全部</span></button><button class="mode-option" type="button" data-mode="level" aria-pressed="false"><span class="mode-icon" aria-hidden="true">1–3</span><span class="mode-label">分難度</span></button><button class="mode-option" type="button" data-mode="dinosaur" aria-pressed="false"><span class="mode-icon" aria-hidden="true">🦕</span><span class="mode-label">恐龍挑戰</span></button></div></fieldset>
        <div id="levelControl" class="level-control hidden"><label id="levelText" for="levelSlider">第一級</label><input id="levelSlider" type="range" min="1" max="3" step="1" value="1" aria-label="選擇難度等級"><div class="level-marks" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div></div>
        <div class="round-summary"><span class="summary-star" aria-hidden="true">✦</span><span id="roundCountLabel">每回合 <strong id="startCount">5</strong> 題</span><i aria-hidden="true"></i><span id="fourChoicesLabel">每題 4 張圖</span></div>
        <button id="startButton" class="primary-button" type="button"><span class="start-label">開始任務</span><span class="button-arrow" aria-hidden="true">➜</span></button>
      </div>
      <div class="start-ground" aria-hidden="true"></div>
    </section>

    <section id="playScreen" class="screen play-screen hidden" aria-label="選圖遊戲">
      <div class="game-topline"><button id="homeButton" class="home-button" type="button"><span aria-hidden="true">⌂</span><span class="home-label">回首頁</span></button><span class="task-label"><span aria-hidden="true">✉</span><span id="taskTitle">今日任務</span></span><span id="scoreText" class="score-pill">第一次答對 0 題</span></div>
      <div class="route-row"><span id="progressText">第 1 題／共 5 題</span><div id="progressDots" class="progress-dots" aria-hidden="true"></div></div>
      <div class="game-board">
        <div id="mailFlight" class="mail-flight" aria-hidden="true">✉</div>
        <div class="board-scene" aria-hidden="true"><span class="scene-sun"></span><span class="scene-cloud scene-cloud-a"></span><span class="scene-cloud scene-cloud-b"></span><span class="scene-hill scene-hill-a"></span><span class="scene-hill scene-hill-b"></span><div id="feifeiPlay" class="play-feifei"><div class="feifei-actor feifei-fly"></div></div></div>
        <div class="question-wrap">
          <div id="iggyActor" class="iggy-mini" aria-hidden="true"><div class="iggy-actor pose-listen"></div></div>
          <div id="questionCard" class="question-card">
            <div class="question-top"><span id="questionTag" class="question-tag">聽單字</span><span class="stamp-icon" aria-hidden="true">✦</span></div>
            <div class="word-line"><strong id="englishWord">cat</strong><button id="audioButton" class="audio-button" type="button" aria-label="再聽一次英文發音"><span class="speaker-icon" aria-hidden="true">♫</span><span class="replay-label">再聽</span></button></div>
            <p id="audioStatus" class="audio-status" role="status"></p>
          </div>
        </div>
        <div class="sort-tray">
          <div class="tray-heading"><span aria-hidden="true">✦</span><p id="instruction">選圖片</p><span aria-hidden="true">✦</span><div id="abaoPlay" class="play-abao" aria-hidden="true"><div class="abao-actor abao-sort"></div></div></div>
          <div id="choices" class="choices" role="group" aria-label="四張圖片選項"></div>
          <div id="trayBottom" class="tray-bottom"><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="nextButton" class="primary-button next-button hidden" type="button"><span class="next-label">下一題</span><span class="button-arrow" aria-hidden="true">➜</span></button></div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen hidden" aria-labelledby="resultTitle">
      <div class="result-rays" aria-hidden="true"></div>
      <div class="result-medal" aria-hidden="true"><span id="resultSymbol">★</span></div><div class="result-crew" aria-hidden="true"><div class="result-feifei"><div class="feifei-actor feifei-deliver"></div></div><div class="result-iggy"><div class="iggy-actor pose-celebrate"></div></div><div class="result-abao"><div class="abao-actor abao-cheer"></div></div></div>
      <p class="eyebrow">任務完成 · SPECIAL DELIVERY</p>
      <h1 id="resultTitle"><span id="resultTitleLine1">今天的郵件</span><br><span id="resultTitleLine2">送達啦！</span></h1>
      <p class="result-score"><span id="resultScoreLabel">第一次就答對</span> <strong id="finalScore">0／5</strong> <span id="resultCountUnit">題</span></p>
      <p id="resultCopy" class="result-copy">你完成任務了！</p>
      <div class="result-actions"><button id="againButton" class="primary-button" type="button"><span class="again-label">再玩一次</span><span class="button-arrow" aria-hidden="true">➜</span></button><button id="resultHomeButton" class="home-button result-home" type="button"><span aria-hidden="true">⌂</span><span class="home-label">回首頁</span></button></div>
    </section>
  </main>

  <dialog id="settingsDialog" class="settings-dialog">
    <div id="settingsMain" class="settings-page">
      <div class="dialog-head"><span class="dialog-icon" aria-hidden="true">✉</span><h2>遊戲設定</h2><button class="close-button" type="button" aria-label="關閉設定" data-close-settings>✕</button></div>
      <label for="questionCount">每回合題數</label>
      <div class="stepper"><button id="minusButton" type="button" aria-label="減少一題">−</button><output id="countOutput" for="questionCount">5</output><button id="plusButton" type="button" aria-label="增加一題">＋</button></div>
      <input id="questionCount" type="range" min="3" max="10" value="5" aria-label="每回合題數">
      <p class="setting-note">可以選 3 到 10 題。新設定會在下一回合使用。</p>
      <button id="openWordBank" class="settings-link" type="button"><span><strong>題庫管理</strong><small id="settingsBankSummary">載入題庫中…</small></span><span aria-hidden="true">›</span></button>
      <button class="primary-button dialog-done" type="button" data-close-settings><span>完成設定</span><span class="button-arrow" aria-hidden="true">✓</span></button>
    </div>
    <div id="wordBankPage" class="settings-page hidden">
      <div class="dialog-head"><button id="backToSettings" class="back-button" type="button" aria-label="返回遊戲設定">‹</button><h2>題庫管理</h2><button class="close-button" type="button" aria-label="關閉設定" data-close-settings>✕</button></div>
      <p class="setting-note">選擇可出現的單字。關閉的單字也不會出現在四張圖片選項中。設定保存在這台裝置，下一回合生效。</p>
      <div id="bankStats" class="bank-stats" aria-live="polite"></div>
      <div class="bank-controls"><label for="bankSearch">搜尋單字</label><input id="bankSearch" type="search" placeholder="英文或中文"><label for="bankFilter">篩選題庫</label><select id="bankFilter"><option value="all">全部題庫</option><option value="1">第一級</option><option value="2">第二級</option><option value="3">第三級</option><option value="dinosaur">恐龍挑戰</option></select></div>
      <p id="bankListCount" class="bank-list-count"></p>
      <div id="bankList" class="bank-list"></div>
      <p id="bankMessage" class="bank-message" role="status" aria-live="polite"></p>
      <button id="resetWordBank" class="reset-bank" type="button">全部恢復啟用</button>
    </div>
  </dialog>
</body>
</html>
