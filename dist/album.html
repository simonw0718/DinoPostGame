<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>集郵冊・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="album.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css">
  <script src="shared.js" defer></script><script src="progress.js" defer></script><script src="stamps-ui.js" defer></script><script src="album.js" defer></script>
</head>
<body data-page="album">
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <main class="shell album-shell">
    <header class="gh gh-light">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="albumTitle" class="gh-title">集郵冊</h1>
      <div class="gh-tools"></div>
    </header>
    <section class="album-summary" aria-live="polite">
      <div class="summary-line"><span id="wordSummary"></span><span id="cardSummary"></span></div>
      <div class="summary-bar" role="img" id="nextBar"><i></i></div>
      <p id="nextText" class="summary-next"></p>
    </section>
    <div class="album-tabs" role="tablist">
      <button id="tabWords" role="tab" aria-selected="true" type="button"></button>
      <button id="tabCards" role="tab" aria-selected="false" type="button"></button>
    </div>
    <nav id="chips" class="album-chips" aria-label="分類"></nav>
    <section id="grid" class="album-grid" aria-live="polite"></section>
  </main>
  <dialog id="stampDialog" class="stamp-dialog">
    <div id="stampDialogBody"></div>
    <button id="stampDialogClose" class="stamp-dialog-close" type="button" aria-label="關閉">✕</button>
  </dialog>
  <p id="loadError" class="album-error" hidden>題庫載入失敗</p>
</body>
</html>
