<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="description" content="跟著恐龍郵局的夥伴聽單字、選圖片。">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>找圖片・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="finish-card.css?v=5"><link rel="stylesheet" href="style.css?v=b8"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css?v=2"><link rel="stylesheet" href="howto.css?v=6"><link rel="stylesheet" href="preview.css?v=3">
  <script>if (/[?&]settings=/.test(location.search)) document.documentElement.classList.add('deep');</script>
  <script src="shared.js" defer></script><script src="progress.js" defer></script><script src="app.js?v=b4" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <main class="shell">
    <header class="gh gh-light">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="gameTitle" class="gh-title">找圖片</h1>
      <div class="gh-tools"><button id="helpButton" class="gh-btn" type="button" aria-label="玩法">?</button><button id="settingsButton" class="gh-btn" type="button" aria-label="設定"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>

    <section id="playScreen" class="screen play-screen hidden" aria-label="選圖遊戲">
      <div class="game-topline"><span class="task-label"><span aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-letter"/></svg></span><span id="taskTitle">今日任務</span></span><span id="scoreText" class="score-pill">第一次答對 0 題</span></div>
      <div class="route-row"><span id="progressText">第 1 題／共 5 題</span><div id="progressDots" class="progress-dots" aria-hidden="true"></div></div>
      <div class="game-board">
        <div id="mailFlight" class="mail-flight" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-letter"/></svg></div>
        <div class="board-scene" aria-hidden="true"><span class="scene-sun"></span><span class="scene-cloud scene-cloud-a"></span><span class="scene-cloud scene-cloud-b"></span><span class="scene-hill scene-hill-a"></span><span class="scene-hill scene-hill-b"></span></div>
        <div id="playActorFrameB" class="play-feifei cast-stamp" aria-hidden="true"><div id="playActorB" class="spotlight-actor"></div></div>
        <div class="question-wrap">
          <div id="playActorFrameA" class="iggy-mini" aria-hidden="true"><div id="playActorA" class="spotlight-actor"></div></div>
          <div id="questionCard" class="question-card">
            <div class="question-top"><span id="questionTag" class="question-tag">聽單字</span><span class="stamp-icon" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sparkle"/></svg></span></div>
            <div class="word-line"><strong id="englishWord">cat</strong><button id="audioButton" class="audio-button" type="button" aria-label="再聽一次英文發音"><span class="speaker-icon" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sound"/></svg></span><span class="replay-label">再聽</span></button></div>
            <p id="audioStatus" class="audio-status" role="status"></p>
          </div>
        </div>
        <div class="sort-tray">
          <div class="tray-heading"><span aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sparkle"/></svg></span><p id="instruction">選圖片</p><span aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sparkle"/></svg></span><div id="playActorFrameC" class="play-abao cast-stamp" aria-hidden="true"><div id="playActorC" class="spotlight-actor"></div></div></div>
          <div id="choices" class="choices" role="group" aria-label="四個選項"></div>
          <div id="trayBottom" class="tray-bottom"><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="nextButton" class="primary-button next-button hidden" type="button"><span class="next-label">下一題</span><span class="button-arrow" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-next"/></svg></span></button></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 結尾框改共用 finish-card.css（導演 2026-11-10：全遊戲一致；原整頁結果 #resultScreen 拿掉） -->
  <div id="finish" class="overlay" hidden style="--gold:#e3bd70;--cream:#fffdf2;--ink:#17593f">
    <div class="card">
      <img id="finishActor" alt="">
      <h2 id="resultTitle"><span id="resultTitleLine1">今天的郵件</span><span id="resultTitleLine2">送達啦！</span></h2>
      <p id="finishStars" class="stars"></p>
      <p class="result-score"><span id="resultScoreLabel">第一次就答對</span> <strong id="finalScore">0／5</strong> <span id="resultCountUnit">題</span></p>
      <div class="actions"><button id="againButton" type="button"><span class="again-label">再玩一次</span></button><a id="resultHomeButton" href="index.html"><span class="home-label">回首頁</span></a></div>
    </div>
  </div>

  <!-- B 流程（導演 2026-11-10）：進頁就是遊戲畫面＋開始浮層（選項＋紅色播放鈕）；按播放才開始 -->
  <div id="readyOverlay" class="ready-tap">
    <div class="ready-pick" role="group" aria-label="答題方式"><button type="button" data-answer="image" aria-pressed="true">找圖片</button><button type="button" data-answer="english" aria-pressed="false">找單字</button></div>
    <div id="levelPick" class="ready-pick" role="group" aria-label="難度"><button type="button" data-lv="all" aria-pressed="true">全部</button><button type="button" data-lv="1" aria-pressed="false">1</button><button type="button" data-lv="2" aria-pressed="false">2</button><button type="button" data-lv="3" aria-pressed="false">3</button></div>
    <button id="readyStart" class="ready-start" type="button" aria-label="點一下，開始找圖片" disabled>
      <span class="ready-go" aria-hidden="true"><span class="ready-ring"></span><span class="ready-ring r2"></span><span class="ready-icon"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-play"/></svg></span></span>
      <span id="readyTitle" class="ready-label">點一下，開始找圖片！</span>
    </button>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <div id="settingsMain" class="settings-page">
      <div class="dialog-head"><span class="dialog-icon" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-letter"/></svg></span><h2>遊戲設定</h2><button class="close-button" type="button" aria-label="關閉設定" data-close-settings><svg class="di" aria-hidden="true"><use href="icons.svg#ic-close"/></svg></button></div>
      <label id="autoAudioControl" class="auto-audio-control"><input id="autoAudioToggle" type="checkbox" checked><span class="switch-track" aria-hidden="true"></span><span class="switch-label">自動發音</span></label>
      <fieldset id="settingsLevel" class="answer-picker"><legend>難度</legend><div class="answer-options lv-options"><button type="button" class="answer-option" data-set-lv="all" aria-pressed="true">全部</button><button type="button" class="answer-option" data-set-lv="1" aria-pressed="false">1</button><button type="button" class="answer-option" data-set-lv="2" aria-pressed="false">2</button><button type="button" class="answer-option" data-set-lv="3" aria-pressed="false">3</button></div></fieldset>
      <label for="questionCount">每回合題數</label>
      <div class="stepper"><button id="minusButton" type="button" aria-label="減少一題">−</button><output id="countOutput" for="questionCount">5</output><button id="plusButton" type="button" aria-label="增加一題">＋</button></div>
      <input id="questionCount" type="range" min="3" max="10" value="5" aria-label="每回合題數">
      <p class="setting-note">可以選 3 到 10 題。新設定會在下一回合使用。</p>
      <button id="openWordBank" class="settings-link" type="button"><span><strong>題庫管理</strong><small id="settingsBankSummary">載入題庫中…</small></span><span aria-hidden="true">›</span></button>
      <button id="openHistory" class="settings-link" type="button"><span><strong>作答紀錄</strong><small>查看最近 10 回合的題數與成績</small></span><span aria-hidden="true">›</span></button>
      <button class="primary-button dialog-done" type="button" data-close-settings><span>完成設定</span><span class="button-arrow" aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-tick"/></svg></span></button>
    </div>
    <div id="wordBankPage" class="settings-page hidden">
      <div class="dialog-head"><button id="backToSettings" class="back-button" type="button" aria-label="返回遊戲設定">‹</button><h2>題庫管理</h2><button class="close-button" type="button" aria-label="關閉設定" data-close-settings><svg class="di" aria-hidden="true"><use href="icons.svg#ic-close"/></svg></button></div>
      <p class="setting-note">選擇可出現的單字。關閉的單字也不會出現在四個選項中。設定保存在這台裝置，下一回合生效。</p>
      <div id="bankStats" class="bank-stats" aria-live="polite"></div>
      <div class="bank-controls"><label for="bankSearch">搜尋單字</label><input id="bankSearch" type="search" placeholder="英文或中文"><label for="bankFilter">篩選題庫</label><select id="bankFilter"><option value="all">全部題庫</option><option value="1">英文第一級</option><option value="2">英文第二級</option><option value="3">英文第三級</option><option value="dinosaur">恐龍</option></select></div>
      <div class="bank-controls bank-topic-row" id="bankTopicRow" hidden><label for="bankTopic">主題</label><select id="bankTopic"><option value="all">全部主題</option></select></div>
      <p id="bankListCount" class="bank-list-count"></p>
      <div id="bankList" class="bank-list"></div>
      <p id="bankMessage" class="bank-message" role="status" aria-live="polite"></p>
      <button id="resetWordBank" class="reset-bank" type="button">全部恢復啟用</button>
    </div>
    <div id="historyPage" class="settings-page hidden">
      <div class="dialog-head"><button id="backFromHistory" class="back-button" type="button" aria-label="返回遊戲設定">‹</button><h2>作答紀錄</h2><button class="close-button" type="button" aria-label="關閉設定" data-close-settings><svg class="di" aria-hidden="true"><use href="icons.svg#ic-close"/></svg></button></div>
      <p class="setting-note">只記錄這台裝置最近 10 個已完成的回合；「答對」是第一次就選對的題目。</p>
      <div id="historyList" class="history-list"></div>
      <button id="clearHistory" class="reset-bank" type="button">清除作答紀錄</button>
    </div>
  </dialog>
</body>
</html>
