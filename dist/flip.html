<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>郵差翻翻樂・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="flip.css"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css"><link rel="stylesheet" href="howto.css"><link rel="stylesheet" href="preview.css">
  <script src="vendor/motion.js"></script>
  <script src="shared.js" defer></script><script src="progress.js" defer></script><script src="flip.js" defer></script>
</head>
<body>
  <div id="shell" class="fs-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">郵差翻翻樂</h1>
      <div class="gh-tools"><button id="helpButton" class="gh-btn" type="button" aria-label="玩法">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="對數選單"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button></div>
    </header>

    <section class="fs-host">
      <div class="fs-actor"><img id="actorImg" alt=""></div>
      <p id="bubble" class="fs-bubble" role="status" aria-live="polite"></p>
    </section>

    <main id="board" class="fs-board" role="group" aria-label="信封"></main>

    <footer class="fs-bag">
      <span class="fs-bag-icon" aria-hidden="true">📮</span>
      <ol id="slots" class="fs-slots" aria-label="已配好的信"></ol>
    </footer>

    <div id="reveal" class="fs-reveal" hidden aria-hidden="true">
      <div class="fs-reveal-card">
        <span id="revealArt" class="fs-reveal-art"></span>
        <strong id="revealZh" class="fs-reveal-zh"></strong>
        <span id="revealEn" class="fs-reveal-en"></span>
        <span class="fs-reveal-mark"><img src="assets/dinopost-workmark-stamp-transparent-v1.png" alt=""></span>
      </div>
    </div>
  </div>

  <div id="readyOverlay" class="ready-tap">
    <div class="ready-pick" role="group" aria-label="信的數量"><button type="button" data-pick="6">6</button><button type="button" data-pick="8">8</button><button type="button" data-pick="10">10</button><span id="pickUnit">對</span></div>
    <button id="readyStart" class="ready-start" type="button" aria-label="點一下，開始翻信">
      <span class="ready-go" aria-hidden="true"><span class="ready-ring"></span><span class="ready-ring r2"></span><span class="ready-icon">▶</span></span>
      <span id="readyTitle" class="ready-label">點一下，開始翻信！</span>
    </button>
  </div>

  <div id="finishOverlay" class="finish-overlay" hidden>
    <div class="finish-card">
      <img id="finishActor" class="finish-actor" alt="">
      <h2 id="finishTitle">信都配好了！</h2>
      <p id="finishStars" class="finish-stars" aria-label="星星"></p>
      <p class="finish-count"><span id="finishFlipsLabel">翻了</span> <strong id="finishFlips"></strong> <span id="finishTimes">次</span></p>
      <div class="finish-actions"><button id="playAgain" type="button">再玩一次</button><a id="finishHome" href="index.html">回首頁</a></div>
    </div>
  </div>
</body>
</html>
