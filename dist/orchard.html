<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fc4ea">
  <title>小空果果店・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="howto.css?v=6"><link rel="stylesheet" href="preview.css?v=3"><link rel="stylesheet" href="game-header.css"><link rel="stylesheet" href="finish-card.css?v=5">
  <script src="shared.js"></script>
  <link rel="stylesheet" href="orchard.css">
</head>
<body>
  <!-- 小空果果店 v6 sample（2026-11-09 晚：統一頁首＋？／⚙、三級難度、開場全景＋小空配音推近；v5：①問還差幾顆滿 10 ④客人輪換 ⑤拖曳進格；v4 導演核准 art-source/orchard/fclose_board.jpg；決定 reference/orchard_shop_design.yaml director_11_09_v4）
       拖果子進格（點果籃也可）；① 十格自動填答 ② 二十格進位（滿 10 蓋蓋）放完三選一。素材 tools/fruit_shop_export.py。
       v1「訂單木箱」備份在 art-source/orchard/v1_web/。 -->
  <div class="fs-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">小空果果店</h1>
      <div class="gh-tools"><button id="help" class="gh-btn" type="button" aria-label="玩法">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="難度選單"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>
    <main class="fs-main">
    <div id="stage" class="fs-stage">
      <img id="sky" class="fs-sky" alt="">
      <img id="cust" class="fs-cust" src="assets/fruitshop/cust_pairo_happy.webp" alt="客人">
      <span id="zzz" class="fs-zzz" aria-hidden="true" hidden>Z<i>z</i><i>z</i></span>
      <div id="bubble" class="fs-bubble" aria-label="客人要的果子"></div>
      <img id="counter" class="fs-counter" alt="">
      <div id="eq" class="fs-eq" aria-live="polite">
        <span id="eqA" class="eq-box is-a"></span><span class="eq-op">+</span><span id="eqB" class="eq-box is-b"></span><span class="eq-op">=</span><span id="eqC" class="eq-box is-c">?</span>
      </div>
      <div id="carry" class="fs-carry" hidden></div>
      <div id="boxes" class="fs-boxes"></div>
      <div id="baskets" class="fs-baskets"></div>
      <div id="choices" class="fs-choices" hidden></div>
      <img id="kong" class="fs-kong" src="assets/fruitshop/xiaokong_happy.webp" alt="">
      <div id="fly" class="fs-fly"></div>
      <span id="hint" class="fs-hint" aria-hidden="true"></span>
      <ol id="rounds" class="fs-rounds" aria-label="第幾位客人"></ol>
      <div id="intro" class="fs-intro" role="img" aria-label="小空的水果攤" hidden><img class="ib" alt=""><img id="introKong" alt=""><img id="introFront" alt=""></div>
    </div>
    </main>
  </div>

  <div id="ready" class="overlay">
    <div class="pick" role="group" aria-label="難度"><button type="button" data-lv="easy">簡單</button><button type="button" data-lv="normal">普通</button><button type="button" data-lv="hard">困難</button></div>
    <p id="rule" class="fs-rule" aria-live="polite"></p>
    <button id="start" class="start" type="button">
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z"/></svg></span><span id="startLabel" class="label">點一下，開始裝果子！</span>
    </button>
  </div>

  <div id="finish" class="overlay" hidden>
    <div class="card">
      <img id="finishActor" src="assets/fruitshop/xiaokong_happy.webp" alt="">
      <h2 id="finishTitle">果子都裝好了！</h2>
      <p id="finishLine" class="fs-line"></p>
      <div class="actions"><button id="again" type="button">再玩一次</button><a id="home" href="index.html">回首頁</a></div>
    </div>
  </div>

<script src="orchard.js?v=3"></script>
</body>
</html>
