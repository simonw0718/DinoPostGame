<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <title>郵局任務單（畫面 sample）・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css">
  <script src="shared.js"></script>
  <style>
    /* 郵局任務單 畫面 sample v2（導演 2026-11-05 意見：規定標題加底、規則三行排、小桌包裹往上拉給阿暴蓋章、送信用正面卡）
       ?view=counter｜rule｜front；?rules=2 看兩個條件的排法。櫃台畫面可以拖拉試玩。 */
    :root{--ink:#24634a;--cream:#fffdf3;--ok:#3d9a5b;--no:#e0533f;--wood:#8a5a2f;--key:#c4471e}
    html,body{margin:0;height:100%;background:#164d39;font-family:"Naikai",ui-rounded,"Noto Sans TC",sans-serif;color:var(--ink)}
    ::selection{background:#f2c14e;color:#24382c}
    .or-shell{max-width:860px;margin:0 auto;padding:0 12px 14px;min-height:100svh;display:flex;flex-direction:column}
    .or-stage{position:relative;width:min(100%,calc((100svh - 110px)*840/1080));aspect-ratio:840/1080;margin:0 auto;border-radius:26px;overflow:hidden;border:4px solid #e9dfc6;box-shadow:0 10px 26px rgba(0,0,0,.28);background:#f6efdc;touch-action:none;user-select:none;-webkit-user-select:none}
    .cam{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .9s cubic-bezier(.16,1,.3,1)}
    .kid-text{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.01em;row-gap:.03em;vertical-align:middle}
    .bpm-word{display:inline-flex;align-items:center;padding-right:.14em;white-space:nowrap}
    .bpm-main-char{font-size:1em;font-weight:900;line-height:1}
    .bpm-column{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:.05em;font-size:.36em;font-weight:800;line-height:1;color:currentColor}
    .bpm-onset,.bpm-rime{display:block;line-height:1.03}
    .bpm-tone{position:absolute;right:-.55em;top:85%;transform:translateY(-50%) scale(1.5,1.8);font-size:1.2em;font-weight:900;color:#d32f2f;line-height:1;height:1em;display:flex;align-items:center}
    .bpm-tone-dot{position:absolute;right:0;top:-.6em;font-size:1.4em;font-weight:900;color:#d32f2f;line-height:1}
    .lay,.sp{position:absolute}
    .lay{inset:0;width:100%;height:100%}
    /* 場景座標 840×1080 → 百分比 */
    .sp{left:calc(var(--x)/840*100%);top:calc(var(--y)/1080*100%);width:calc(var(--w)/840*100%)}
    .sp img{display:block;width:100%;height:auto}

    /* ── 櫃台主畫面 ── */
    .board{--x:34;--y:84;--w:556;z-index:2}
    .board h2{position:absolute;left:50%;top:-3.5%;transform:translateX(-50%) rotate(-1deg);margin:0;padding:.18em .9em .24em;border-radius:14px;background:var(--cream);border:4px solid var(--wood);color:var(--ink);font-size:clamp(14px,2.6vw,22px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.18)}
    .note{position:absolute;left:7%;top:15%;width:86%;transform:rotate(-1.2deg)}
    .note img{width:100%}
    .rule{position:absolute;inset:13% 9% 9%;display:flex;flex-direction:column;justify-content:center;gap:.28em;color:#2b2a27;font-size:clamp(19px,4.2vw,38px);font-weight:900;line-height:1.15}
    .rule .r1{align-self:flex-start}
    .rule .r2{align-self:center;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
    .rule .r3{align-self:flex-end}
    .chip{display:inline-flex;padding:.12em .35em .16em;border:.12em solid var(--key);border-radius:.4em;background:#fff6e4;color:var(--key)}
    .rule .or{font-size:.75em;color:#7a6a55}
    .rules2 .rule{font-size:clamp(16px,3.5vw,32px)}
    .chick{--x:600;--y:262;--w:196;z-index:1}
    .counter{--x:74;--y:448;--w:692;z-index:3}
    .zone{position:absolute;z-index:4;left:calc(380/840*100%);top:calc(370/1080*100%);width:calc(220/840*100%);height:calc(124/1080*100%);border:4px dashed var(--cream);border-radius:18px;background:rgba(36,99,74,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);font-size:clamp(14px,2.4vw,21px);font-weight:900;transition:transform .2s,background .2s}
    .zone img{width:24%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
    .zone.hot{transform:scale(1.07);background:rgba(242,193,78,.75)}
    .table{--x:62;--y:798;--w:716;z-index:5}
    .pc{position:absolute;z-index:6;left:calc(var(--x)/840*100%);top:calc(var(--y)/1080*100%);width:calc(170/840*100%);aspect-ratio:249/201;cursor:grab;touch-action:none}
    .pc>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .pc img{pointer-events:none}
    .pc .st{position:absolute;top:30%;width:19%;height:auto}
    .pc .str{position:absolute;left:12%;top:-12%;width:80%;height:auto}
    .pc .stk{position:absolute;left:8%;top:52%;width:24%;height:auto}
    .pc.drag{cursor:grabbing;z-index:9;filter:drop-shadow(0 14px 10px rgba(0,0,0,.3))}
    .pc.back{transition:transform .35s cubic-bezier(.16,1,.3,1)}
    .pc.shake{animation:shake .4s}
    @keyframes shake{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
    .pc.done{transition:left .3s,top .3s,transform .3s;pointer-events:none}
    .pc .ink{position:absolute;left:30%;top:14%;width:44%;aspect-ratio:1;border:5px solid var(--no);border-radius:50%;color:var(--no);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2.6vw,22px);font-weight:900;transform:rotate(-14deg) scale(2);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s;background:rgba(255,253,243,.6)}
    .pc.done .ink{transform:rotate(-14deg) scale(1);opacity:1}
    .board h2 .kid-text,.board h2.kid-text,.ask.kid-text,.chip.kid-text,.fsay.kid-text,.say.kid-text{flex-wrap:nowrap}
    .ask{position:absolute;z-index:7;left:50%;bottom:2.2%;transform:translateX(-50%);padding:8px 20px;border-radius:99px;background:var(--cream);border:3px solid var(--wood);font-size:clamp(16px,2.9vw,25px);font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.18);white-space:nowrap}
    .say{position:absolute;z-index:8;right:3%;top:calc(206/1080*100%);max-width:44%;padding:10px 14px;border-radius:20px;background:var(--cream);border:4px solid var(--ink);font-size:clamp(14px,2.5vw,21px);font-weight:900;line-height:1.3;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
    .say.on{opacity:1;transform:none}
    .stamps{position:absolute;z-index:8;left:3%;top:2.4%;display:flex;gap:5px}
    .stamps i{width:clamp(18px,3.2vw,28px);aspect-ratio:5/6;border:3px dashed #c9b48a;border-radius:3px;background:rgba(255,253,243,.7)}
    .stamps i.done{border-style:solid;border-color:#fffdf3;background:#f2c14e}
    .listen{position:absolute;z-index:8;right:3%;top:2.2%;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:3px dashed #9db89a;background:rgba(255,253,243,.85);color:#7d9a7a;font:900 clamp(13px,2.2vw,18px) "Naikai",sans-serif}
    .listen svg{width:1.2em;height:1.2em}

    /* ── 規則放大鏡頭 ── */
    .v-rule .cam{--ox:37%;--oy:12%;transform:scale(1.5)}
    .v-rule .ask,.v-rule .pc,.v-rule .zone,.v-rule .chick{opacity:0}
    .bubble{display:none;position:absolute;z-index:9;left:31%;right:4%;bottom:5%;padding:16px 20px;background:var(--cream);border:5px solid var(--ink);border-radius:30px;font-size:clamp(20px,3.8vw,32px);font-weight:900;line-height:1.3;box-shadow:0 8px 18px rgba(0,0,0,.2)}
    .bubble:before{content:"";position:absolute;left:-30px;bottom:30px;border:14px solid transparent;border-right:20px solid var(--ink)}
    .cutin{display:none;position:absolute;z-index:9;left:2%;bottom:0;width:30%}
    .cutin img{display:block;width:100%}
    .v-rule .bubble,.v-rule .cutin{display:block}

    /* ── 櫃台前（送信）：正面卡 ── */
    .front{display:none}
    .v-front .counterView{display:none}.v-front .front{display:block}
    .tag{position:absolute;z-index:6;left:5%;right:5%;top:9%;padding:14px 18px 16px;background:var(--cream);border:4px solid #c9b48a;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.18);transform:rotate(-1deg);text-align:center}
    .tag small{display:block;font-size:clamp(13px,2.2vw,18px);color:var(--wood);font-weight:900}
    .tag p{margin:2px 0 0;font-size:clamp(20px,3.8vw,32px);font-weight:900;line-height:1.3}
    .tag .k{color:var(--key)}
    .cand{z-index:4;cursor:pointer}
    .cand .letter{position:absolute;height:auto}
    .ring{position:absolute;inset:auto 6% -3% 6%;height:7%;border-radius:50%;background:rgba(36,99,74,.2)}
    .front .ask{left:auto;right:3%;transform:none;bottom:2.2%}
    /* 交包裹：拖到收件人身上；對的跳起來收下，錯的搖頭 */
    .fpc{--x:300;--y:906;z-index:7}
    .fpc .ink{transform:rotate(-14deg) scale(1);opacity:1}
    .fpc.given{transition:left .35s,top .35s,width .35s,transform .35s;pointer-events:none}
    .cand>img:first-of-type{transform-origin:50% 100%}
    .cand.hot>img:first-of-type{filter:drop-shadow(0 0 10px #f2c14e) drop-shadow(0 0 4px #fffdf3)}
    .cand.no>img:first-of-type{animation:nope .5s}
    @keyframes nope{0%,100%{rotate:0deg}25%{rotate:-5deg}50%{rotate:5deg}75%{rotate:-3deg}}
    .cand.yes{animation:hop .6s cubic-bezier(.3,1.5,.5,1)}
    @keyframes hop{0%,100%{translate:0 0}40%{translate:0 -9%}}
    .fsay{position:absolute;z-index:8;padding:8px 14px;border-radius:18px;background:var(--cream);border:4px solid var(--ink);font-size:clamp(14px,2.5vw,21px);font-weight:900;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .2s;pointer-events:none}
    .fsay.on{opacity:1}
  </style>
</head>
<body>
  <div class="or-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">郵局任務單</h1>
      <div class="gh-tools"><button class="gh-btn" type="button" aria-label="玩法">?</button><button class="gh-btn" type="button" aria-label="難度選單"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>

    <div id="stage" class="or-stage">
      <!-- 櫃台主畫面：公布欄（規則三行）＋櫃台後小雞阿暴＋蓋章區；櫃台前小桌放 3 個包裹，往上拉給阿暴 -->
      <div class="counterView">
        <div class="cam">
          <img class="lay" src="assets/orders/counter_bg.webp" alt="">
          <div class="sp board"><img src="assets/orders/board.webp" alt=""><h2 data-k="今天的規定">今天的規定</h2>
            <div class="note"><img src="assets/orders/board_note.webp" alt="">
              <div class="rule" id="rule"><span class="r1" data-k="今天不收">今天不收</span><span class="r2" id="conds"></span><span class="r3" data-k="的包裹">的包裹</span></div></div></div>
          <div class="sp chick"><img id="chickImg" src="assets/orders/chick_abao__front__stand_happy.webp" alt="小雞阿暴"></div>
          <div class="sp counter"><img src="assets/orders/counter_desk.webp" alt=""></div>
          <div class="zone" id="zone"><img src="assets/orders/stamp.webp" alt=""><span data-k="蓋章">蓋章</span></div>
          <div class="sp table"><img src="assets/orders/table.webp" alt=""></div>
        </div>
        <div id="parcels"></div>
        <div class="say" id="say"></div>
        <div class="ask" data-k="把可以寄的包裹拉給阿暴">把可以寄的包裹拉給阿暴</div>
        <div class="cutin"><img src="assets/orders/chick_abao__proud__happy__open.webp" alt=""></div>
        <div class="bubble" id="bubble"></div>
      </div>

      <!-- 櫃台前：收件人敘述＋3 隻候選（正面卡） -->
      <div class="front">
        <div class="cam">
          <img class="lay" src="assets/orders/front_bg.webp" alt="">
          <img class="lay" src="assets/orders/front_door_l.webp" alt="">
          <img class="lay" src="assets/orders/front_door_r.webp" alt="">
          <!-- 身高照製作庫 character_scale.json（伊奇 1.0＝340）：阿慢 1.5、奶奶 1.3、小空 0.72；腳底 y=900；櫃台層拿掉空出位置（導演 2026-11-05） -->
          <div class="sp cand" data-ok="false" style="--x:14;--y:390;--w:299"><span class="ring"></span><img src="assets/orders/aman__front__stand.webp" alt="阿慢老師：沒笑、拿著信"><img class="letter" style="left:33%;top:50%;width:34%" src="assets/orders/letter.webp" alt=""></div>
          <div class="sp cand" data-ok="false" style="--x:300;--y:458;--w:297"><span class="ring"></span><img src="assets/orders/grandma__front__smile.webp" alt="奶奶：在笑、沒拿信"></div>
          <div class="sp cand" data-ok="true" style="--x:612;--y:654;--w:192"><span class="ring"></span><img src="assets/orders/xiaokong__front__happy.webp" alt="小空：在笑、拿著信"><img class="letter" style="left:24%;top:55%;width:52%" src="assets/orders/letter.webp" alt=""></div>
        </div>
        <div class="tag"><small data-k="收件人">收件人</small><p data-k="寄給在笑、手上拿著信的收件人。">寄給在笑、手上拿著信的收件人。</p></div>
        <div class="pc fpc" id="fpc"><img src="assets/orders/parcel_red.webp" alt="蓋好章的包裹"><img class="str" src="assets/orders/string.webp" alt=""><img class="st" style="right:8%" src="assets/orders/stamp.webp" alt=""><img class="st" style="right:29%" src="assets/orders/stamp.webp" alt=""><span class="ink">OK</span></div>
        <div class="fsay" id="fsay"></div>
        <div class="stamps" id="fstamps"><i class="done"></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ask" data-k="把包裹交給收件人">把包裹交給收件人</div>
      </div>
      <div class="stamps counterView"><i class="done"></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="listen counterView"><svg aria-hidden="true"><use href="icons.svg#ic-sound"/></svg>8</div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const view = q.get('view') || 'counter', two = q.get('rules') === '2';
    const stage = document.getElementById('stage');
    stage.classList.add('v-' + view); if (two) stage.classList.add('rules2');
    const set = Dino.kidText({
      '郵局任務單': ['ㄧㄡˊ','ㄐㄩˊ','ㄖㄣˋ','ㄨˋ','ㄉㄢ'],
      '今天的規定': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄉㄜ˙','ㄍㄨㄟ','ㄉㄧㄥˋ'],
      '今天不收': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄅㄨˋ','ㄕㄡ'],
      '綠色': ['ㄌㄩˋ','ㄙㄜˋ'],
      '沒有郵票': ['ㄇㄟˊ','ㄧㄡˇ','ㄧㄡˊ','ㄆㄧㄠˋ'],
      '或': ['ㄏㄨㄛˋ'],
      '的包裹': ['ㄉㄜ˙','ㄅㄠ','ㄍㄨㄛˇ'],
      '今天不收綠色的包裹喔！': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄅㄨˋ','ㄕㄡ','ㄌㄩˋ','ㄙㄜˋ','ㄉㄜ˙','ㄅㄠ','ㄍㄨㄛˇ','ㄛ',''],
      '綠色或沒有郵票的不收喔！': ['ㄌㄩˋ','ㄙㄜˋ','ㄏㄨㄛˋ','ㄇㄟˊ','ㄧㄡˇ','ㄧㄡˊ','ㄆㄧㄠˋ','ㄉㄜ˙','ㄅㄨˋ','ㄕㄡ','ㄛ',''],
      '這個不行喔！': ['ㄓㄜˋ','ㄍㄜ˙','ㄅㄨˋ','ㄒㄧㄥˊ','ㄛ',''],
      '蓋好章了！': ['ㄍㄞˋ','ㄏㄠˇ','ㄓㄤ','ㄌㄜ˙',''],
      '蓋章': ['ㄍㄞˋ','ㄓㄤ'],
      '把可以寄的包裹拉給阿暴': ['ㄅㄚˇ','ㄎㄜˇ','ㄧˇ','ㄐㄧˋ','ㄉㄜ˙','ㄅㄠ','ㄍㄨㄛˇ','ㄌㄚ','ㄍㄟˇ','ㄚ','ㄅㄠˋ'],
      '不是我喔！': ['ㄅㄨˋ','ㄕˋ','ㄨㄛˇ','ㄛ',''],
      '謝謝你！': ['ㄒㄧㄝˋ','ㄒㄧㄝ˙','ㄋㄧˇ',''],
      '收件人': ['ㄕㄡ','ㄐㄧㄢˋ','ㄖㄣˊ'],
      '寄給在笑、手上拿著信的收件人。': ['ㄐㄧˋ','ㄍㄟˇ','ㄗㄞˋ','ㄒㄧㄠˋ','','ㄕㄡˇ','ㄕㄤˋ','ㄋㄚˊ','ㄓㄜ˙','ㄒㄧㄣˋ','ㄉㄜ˙','ㄕㄡ','ㄐㄧㄢˋ','ㄖㄣˊ',''],
      '把包裹交給收件人': ['ㄅㄚˇ','ㄅㄠ','ㄍㄨㄛˇ','ㄐㄧㄠ','ㄍㄟˇ','ㄕㄡ','ㄐㄧㄢˋ','ㄖㄣˊ']
    });
    set(document.getElementById('title'), '郵局任務單');

    // 規則：第二行放條件小牌（1 條或 2 條）
    const conds = document.getElementById('conds');
    const chip = t => { const s = document.createElement('span'); s.className = 'chip'; s.dataset.k = t; s.textContent = t; return s; };
    if (two) { const o = document.createElement('span'); o.className = 'or'; o.dataset.k = '或'; o.textContent = '或'; conds.append(chip('綠色'), o, chip('沒有郵票')); }
    else conds.append(chip('綠色'));
    const ruleSay = two ? '綠色或沒有郵票的不收喔！' : '今天不收綠色的包裹喔！';
    const bubble = document.getElementById('bubble'); bubble.dataset.k = ruleSay;
    document.querySelectorAll('[data-k]').forEach(el => set(el, el.dataset.k));
    document.querySelectorAll('.tag p').forEach(p => [2,3,6,7,8].forEach(i => p.children[i]?.classList.add('k')));

    // 小桌上 3 個包裹（sample：一個可以寄）
    const S = 'assets/orders/';
    const parcels = two
      ? [{c:'red', stamp:0, ok:false}, {c:'green', stamp:1, ok:false, str:1}, {c:'blue', stamp:2, ok:true, stk:'star'}]
      : [{c:'green', stamp:1, ok:false}, {c:'red', stamp:2, ok:true, str:1}, {c:'green', stamp:1, ok:false, stk:'heart'}];
    const xs = [108, 335, 562], y = 700;
    const box = document.getElementById('parcels');
    parcels.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'pc'; d.style.cssText = `--x:${xs[i]};--y:${y}`; d.dataset.ok = p.ok;
      d.innerHTML = `<img src="${S}parcel_${p.c}.webp" alt="">` + (p.str ? `<img class="str" src="${S}string.webp" alt="">` : '')
        + Array.from({length: p.stamp}, (_, k) => `<img class="st" style="right:${8 + k * 21}%" src="${S}stamp.webp" alt="">`).join('')
        + (p.stk ? `<img class="stk" src="${S}sticker_${p.stk}.webp" alt="">` : '') + `<span class="ink">OK</span>`;
      box.append(d);
    });

    // 拖拉：放進蓋章區 → 可寄就蓋章；不行就彈回、阿暴說規則
    const zone = document.getElementById('zone'), say = document.getElementById('say'), chickImg = document.getElementById('chickImg');
    const hit = (a, b) => { const r = a.getBoundingClientRect(), z = b.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; return cx > z.left - 20 && cx < z.right + 20 && cy > z.top - 30 && cy < z.bottom + 30; };
    let sayT; const speak = t => { set(say, t); say.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => say.classList.remove('on'), 2200); };
    box.querySelectorAll('.pc').forEach(el => {
      let sx, sy, on = false;
      el.addEventListener('pointerdown', e => { on = true; sx = e.clientX; sy = e.clientY; el.setPointerCapture(e.pointerId); el.classList.remove('back', 'shake'); el.classList.add('drag'); });
      el.addEventListener('pointermove', e => { if (!on) return; el.style.transform = `translate(${e.clientX - sx}px,${e.clientY - sy}px) scale(1.06)`; zone.classList.toggle('hot', hit(el, zone)); });
      const end = () => { if (!on) return; on = false; el.classList.remove('drag'); zone.classList.remove('hot');
        if (hit(el, zone) && el.dataset.ok === 'true') {
          const st = stage.getBoundingClientRect(), z = zone.getBoundingClientRect(), r = el.getBoundingClientRect();
          el.classList.add('done'); el.style.transform = 'none';
          el.style.left = ((z.left + z.width / 2 - r.width / 2 - st.left) / st.width * 100) + '%';
          el.style.top = ((z.top + z.height / 2 - r.height / 2 - st.top) / st.height * 100) + '%';
          chickImg.src = S + "chick_abao__front__proud.webp"; speak('蓋好章了！');
        } else {
          el.classList.add('back'); el.style.transform = '';
          if (hit(el, zone)) { el.classList.add('shake'); speak(ruleSay); }
        } };
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    });

    // 櫃台前：把包裹拖到收件人身上
    const fpc = document.getElementById('fpc'), fsay = document.getElementById('fsay');
    const cands = [...document.querySelectorAll('.cand')];
    const over = (el) => { const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      return cands.find(c => { const z = c.querySelector('img').getBoundingClientRect(); return cx > z.left && cx < z.right && cy > z.top && cy < z.bottom; }); };
    let fT; const fspeak = (c, t) => { const st = stage.getBoundingClientRect(), z = c.querySelector('img').getBoundingClientRect();
      fsay.style.left = ((z.left + z.width / 2 - st.left) / st.width * 100) + '%'; fsay.style.top = ((z.top - st.top) / st.height * 100 + 1) + '%';
      set(fsay, t); fsay.classList.add('on'); clearTimeout(fT); fT = setTimeout(() => fsay.classList.remove('on'), 1800); };
    let fx, fy, fon = false;
    fpc.addEventListener('pointerdown', e => { fon = true; fx = e.clientX; fy = e.clientY; fpc.setPointerCapture(e.pointerId); fpc.classList.remove('back'); fpc.classList.add('drag'); });
    fpc.addEventListener('pointermove', e => { if (!fon) return; fpc.style.transform = `translate(${e.clientX - fx}px,${e.clientY - fy}px) scale(1.06)`; const h = over(fpc); cands.forEach(c => c.classList.toggle('hot', c === h)); });
    const fend = () => { if (!fon) return; fon = false; fpc.classList.remove('drag'); const c = over(fpc); cands.forEach(x => x.classList.remove('hot'));
      if (c && c.dataset.ok === 'true') {
        const st = stage.getBoundingClientRect(), z = c.querySelector('img').getBoundingClientRect(), r = fpc.getBoundingClientRect();
        fpc.classList.add('given'); fpc.style.transform = 'none';
        const w = r.width * .7; fpc.style.width = (w / st.width * 100) + '%';
        fpc.style.left = ((z.left + z.width / 2 - w / 2 - st.left) / st.width * 100) + '%';
        fpc.style.top = ((z.top + z.height * .5 - st.top) / st.height * 100) + '%';
        c.classList.add('yes'); fspeak(c, '謝謝你！');
        document.querySelector('#fstamps i:not(.done)')?.classList.add('done');
      } else {
        fpc.classList.add('back'); fpc.style.transform = '';
        if (c) { c.classList.remove('no'); void c.offsetWidth; c.classList.add('no'); fspeak(c, '不是我喔！'); }
      } };
    fpc.addEventListener('pointerup', fend); fpc.addEventListener('pointercancel', fend);
  </script>
</body>
</html>
