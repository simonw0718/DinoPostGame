<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <title>郵局任務單（畫面 sample）・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css">
  <script src="shared.js"></script>
  <style>
    /* 郵局任務單 畫面 sample（導演 2026-11-05）：只看版面，不能玩。?view=counter｜rule｜front */
    :root{--ink:#24634a;--cream:#fffdf3;--ok:#3d9a5b;--no:#e0533f;--wood:#8a5a2f}
    html,body{margin:0;height:100%;background:#164d39;font-family:"Naikai",ui-rounded,"Noto Sans TC",sans-serif;color:var(--ink)}
    ::selection{background:#f2c14e;color:#24382c}
    .or-shell{max-width:860px;margin:0 auto;padding:0 12px 14px;min-height:100svh;display:flex;flex-direction:column}
    .or-stage{position:relative;width:min(100%,calc((100svh - 110px)*840/1080));aspect-ratio:840/1080;margin:0 auto;border-radius:26px;overflow:hidden;border:4px solid #e9dfc6;box-shadow:0 10px 26px rgba(0,0,0,.28);background:#f6efdc}
    .cam{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .9s cubic-bezier(.16,1,.3,1)}
    .kid-text{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.01em;row-gap:.03em;vertical-align:middle}
    .bpm-word{display:inline-flex;align-items:center;padding-right:.14em;white-space:nowrap}
    .bpm-main-char{font-size:1em;font-weight:900;line-height:1}
    .bpm-column{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:.05em;font-size:.36em;font-weight:800;line-height:1;color:currentColor}
    .bpm-onset,.bpm-rime{display:block;line-height:1.03}
    .bpm-tone{position:absolute;right:-.55em;top:85%;transform:translateY(-50%) scale(1.5,1.8);font-size:1.2em;font-weight:900;color:#d32f2f;line-height:1;height:1em;display:flex;align-items:center}
    .bpm-tone-dot{position:absolute;right:0;top:-.6em;font-size:1.4em;font-weight:900;color:#d32f2f;line-height:1}
    .lay,.sp{position:absolute}
    .lay{inset:0;width:100%;height:100%}
    /* 場景座標 840×1080 → 百分比 */
    .sp{left:calc(var(--x)/840*100%);top:calc(var(--y)/1080*100%);width:calc(var(--w)/840*100%)}
    .sp img{display:block;width:100%;height:auto}
    .board{--x:186;--y:118;--w:620}
    .note{position:absolute;left:9%;top:17%;width:82%;transform:rotate(-1.5deg)}
    .note img{width:100%}
    .note p{position:absolute;inset:16% 6% 10%;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(17px,3.5vw,30px);font-weight:900;line-height:1.25;color:#2b2a27}
    .note p .k{color:#c4471e}
    .board h2{position:absolute;left:0;right:0;top:-1%;margin:0;text-align:center;font-size:clamp(13px,2.4vw,20px);color:#fffdf3;text-shadow:0 2px 0 rgba(0,0,0,.25)}
    .chick{--x:112;--y:438;--w:156}
    .counterLay{z-index:3}
    .parcels{z-index:4}
    .pc{position:absolute;left:calc(var(--x)/840*100%);top:calc(var(--y)/1080*100%);width:calc(150/840*100%);aspect-ratio:249/201;border-radius:10px;cursor:pointer;transition:transform .25s cubic-bezier(.16,1,.3,1)}
    .pc>img{position:absolute;inset:0;width:100%;height:100%}
    .pc .st{position:absolute;top:30%;width:19%;}
    .pc .str{position:absolute;left:12%;top:-12%;width:80%}
    .pc .stk{position:absolute;left:8%;top:52%;width:24%}
    .pc.picked{transform:translateY(-14%) rotate(-3deg);filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
    .pc.picked:after{content:"";position:absolute;inset:-8%;border:4px dashed #fffdf3;border-radius:14px}
    .stamps{position:absolute;z-index:5;left:3%;top:2.4%;display:flex;gap:5px}
    .stamps i{width:clamp(18px,3.2vw,28px);aspect-ratio:5/6;border:3px dashed #c9b48a;border-radius:3px;background:rgba(255,253,243,.7)}
    .stamps i.done{border-style:solid;border-color:#fffdf3;background:#f2c14e}
    .listen{position:absolute;z-index:5;right:3%;top:2.2%;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:3px dashed #9db89a;background:rgba(255,253,243,.85);color:#7d9a7a;font:900 clamp(13px,2.2vw,18px) "Naikai",sans-serif}
    .listen svg{width:1.2em;height:1.2em}
    .ask{position:absolute;z-index:6;left:50%;bottom:17%;transform:translateX(-50%);padding:6px 18px;border-radius:99px;background:var(--cream);font-size:clamp(16px,3vw,26px);font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.15);white-space:nowrap}
    .bins{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;display:flex;gap:4%}
    .bin{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:clamp(64px,10vw,92px);border:4px solid #fffdf3;border-radius:22px;color:#fff;font:900 clamp(22px,4vw,34px) "Naikai",sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 18px rgba(0,0,0,.18)}
    .bin svg{width:1.1em;height:1.1em}
    .bin.ok{background:var(--ok)}.bin.no{background:var(--no)}
    /* 規則放大鏡頭 */
    .v-rule .cam{--ox:59%;--oy:30%;transform:scale(1.55)}
    .v-rule .bins,.v-rule .ask,.v-rule .parcels,.v-rule .chick{opacity:0}
    .bubble{display:none;position:absolute;z-index:7;left:31%;right:4%;bottom:5%;padding:16px 20px;background:var(--cream);border:5px solid var(--ink);border-radius:30px;font-size:clamp(20px,3.8vw,32px);font-weight:900;line-height:1.3;box-shadow:0 8px 18px rgba(0,0,0,.2)}
    .bubble:before{content:"";position:absolute;left:-30px;bottom:30px;border:14px solid transparent;border-right:20px solid var(--ink)}
    .cutin{display:none;position:absolute;z-index:7;left:2%;bottom:0;width:30%}
    .cutin img{display:block;width:100%}
    .v-rule .bubble,.v-rule .cutin{display:block}
    /* 櫃台前（送信） */
    .front{display:none}
    .v-front .counterView{display:none}.v-front .front{display:block}
    .tag{position:absolute;z-index:6;left:5%;right:5%;top:9%;padding:14px 18px 16px;background:var(--cream);border:4px solid #c9b48a;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.18);transform:rotate(-1deg);text-align:center}
    .tag small{display:block;font-size:clamp(13px,2.2vw,18px);color:var(--wood);font-weight:900}
    .tag p{margin:2px 0 0;font-size:clamp(20px,3.8vw,32px);font-weight:900;line-height:1.3}
    .tag .k{color:#c4471e}
    .cand{z-index:4;cursor:pointer}
    .cand .letter{position:absolute;width:44%}
    .hint{position:absolute;z-index:6;left:0;right:0;bottom:2.5%;text-align:center;color:#fffdf3;font-size:clamp(15px,2.6vw,22px);font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.4)}
    .ring{position:absolute;inset:auto 8% -4% 8%;height:9%;border-radius:50%;background:rgba(36,99,74,.18)}
  </style>
</head>
<body>
  <div class="or-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">郵局任務單</h1>
      <div class="gh-tools"><button class="gh-btn" type="button" aria-label="玩法">?</button><button class="gh-btn" type="button" aria-label="難度選單"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>

    <div id="stage" class="or-stage">
      <!-- 櫃台主畫面：公布欄＋小雞阿暴＋檯面 3 個包裹 -->
      <div class="counterView">
        <div class="cam">
          <img class="lay" src="assets/orders/counter_bg.webp" alt="">
          <div class="sp board"><img src="assets/orders/board.webp" alt=""><h2 data-k="今天的規定">今天的規定</h2>
            <div class="note"><img src="assets/orders/board_note.webp" alt=""><p data-k="今天不收綠色的包裹">今天不收綠色的包裹</p></div></div>
          <div class="sp chick"><img src="assets/orders/chick_abao__stand__happy__open.webp" alt="小雞阿暴"></div>
          <img class="lay counterLay" src="assets/orders/counter_counter.webp" alt="">
          <div class="parcels">
            <div class="pc" style="--x:300;--y:524"><img src="assets/orders/parcel_red.webp" alt="紅色包裹"><img class="st" style="right:8%" src="assets/orders/stamp.webp" alt=""><img class="st" style="right:29%" src="assets/orders/stamp.webp" alt=""></div>
            <div class="pc picked" style="--x:466;--y:524"><img src="assets/orders/parcel_green.webp" alt="綠色包裹"><img class="str" src="assets/orders/string.webp" alt=""><img class="st" style="right:8%" src="assets/orders/stamp.webp" alt=""></div>
            <div class="pc" style="--x:632;--y:524"><img src="assets/orders/parcel_blue.webp" alt="藍色包裹"><img class="stk" src="assets/orders/sticker_star.webp" alt=""><img class="st" style="right:8%" src="assets/orders/stamp.webp" alt=""></div>
          </div>
        </div>
        <div class="ask" data-k="哪個包裹可以寄？">哪個包裹可以寄？</div>
        <div class="bins"><button class="bin ok" type="button"><svg aria-hidden="true"><use href="icons.svg#ic-tick"/></svg><span data-k="可以寄">可以寄</span></button><button class="bin no" type="button"><svg aria-hidden="true"><use href="icons.svg#ic-close"/></svg><span data-k="退回">退回</span></button></div>
        <div class="cutin"><img src="assets/orders/chick_abao__proud__happy__open.webp" alt=""></div>
        <div class="bubble" data-k="今天不收綠色的包裹喔！">今天不收綠色的包裹喔！</div>
      </div>

      <!-- 櫃台前：包裹轉過來露出收件人，3 隻候選恐龍 -->
      <div class="front">
        <div class="cam">
          <img class="lay" src="assets/orders/front_bg.webp" alt="">
          <img class="lay" src="assets/orders/front_door_l.webp" alt="">
          <img class="lay" src="assets/orders/front_door_r.webp" alt="">
          <img class="lay" src="assets/orders/front_counter.webp" alt="">
          <div class="sp cand" style="--x:14;--y:640;--w:280"><span class="ring"></span><img src="assets/orders/xiaokong__hold__happy__closed.webp" alt="小空：笑、拿著信"><img class="letter" style="left:62%;top:40%" src="assets/orders/letter.webp" alt=""></div>
          <div class="sp cand" style="--x:290;--y:600;--w:262"><span class="ring"></span><img src="assets/orders/yuanyuan__stand__happy__closed.webp" alt="圓圓：笑、空手"></div>
          <div class="sp cand" style="--x:530;--y:652;--w:305"><span class="ring"></span><img src="assets/orders/painuo__hold__troubled__closed.webp" alt="派諾：皺眉、拿著信"><img class="letter" style="left:66%;top:50%" src="assets/orders/letter.webp" alt=""></div>
        </div>
        <div class="tag"><small data-k="收件人">收件人</small><p data-k="寄給在笑、手上拿著信的恐龍。">寄給在笑、手上拿著信的恐龍。</p></div>
        <div class="stamps"><i class="done"></i><i class="done"></i><i></i><i></i><i></i><i></i></div>
        <div class="hint" data-k="把包裹交給收件人">把包裹交給收件人</div>
      </div>
      <div class="stamps counterView"><i class="done"></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="listen counterView"><svg aria-hidden="true"><use href="icons.svg#ic-sound"/></svg>8</div>
    </div>
  </div>
  <script>
    const view = new URLSearchParams(location.search).get('view') || 'counter';
    document.getElementById('stage').classList.add('v-' + view);
    const set = Dino.kidText({
      '郵局任務單': ['ㄧㄡˊ','ㄐㄩˊ','ㄖㄣˋ','ㄨˋ','ㄉㄢ'],
      '今天的規定': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄉㄜ˙','ㄍㄨㄟ','ㄉㄧㄥˋ'],
      '今天不收綠色的包裹': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄅㄨˋ','ㄕㄡ','ㄌㄩˋ','ㄙㄜˋ','ㄉㄜ˙','ㄅㄠ','ㄍㄨㄛˇ'],
      '今天不收綠色的包裹喔！': ['ㄐㄧㄣ','ㄊㄧㄢ','ㄅㄨˋ','ㄕㄡ','ㄌㄩˋ','ㄙㄜˋ','ㄉㄜ˙','ㄅㄠ','ㄍㄨㄛˇ','ㄛ',''],
      '哪個包裹可以寄？': ['ㄋㄚˇ','ㄍㄜ˙','ㄅㄠ','ㄍㄨㄛˇ','ㄎㄜˇ','ㄧˇ','ㄐㄧˋ',''],
      '可以寄': ['ㄎㄜˇ','ㄧˇ','ㄐㄧˋ'],
      '退回': ['ㄊㄨㄟˋ','ㄏㄨㄟˊ'],
      '收件人': ['ㄕㄡ','ㄐㄧㄢˋ','ㄖㄣˊ'],
      '寄給在笑、手上拿著信的恐龍。': ['ㄐㄧˋ','ㄍㄟˇ','ㄗㄞˋ','ㄒㄧㄠˋ','','ㄕㄡˇ','ㄕㄤˋ','ㄋㄚˊ','ㄓㄜ˙','ㄒㄧㄣˋ','ㄉㄜ˙','ㄎㄨㄥˇ','ㄌㄨㄥˊ',''],
      '把包裹交給收件人': ['ㄅㄚˇ','ㄅㄠ','ㄍㄨㄛˇ','ㄐㄧㄠ','ㄍㄟˇ','ㄕㄡ','ㄐㄧㄢˋ','ㄖㄣˊ']
    });
    set(document.getElementById('title'), '郵局任務單');
    document.querySelectorAll('[data-k]').forEach(el => set(el, el.dataset.k));
    // 關鍵詞上色（規則的條件字）
    const mark = (el, idx) => { const u = el.children; idx.forEach(i => u[i] && u[i].classList.add('k')); };
    document.querySelectorAll('.note p').forEach(p => mark(p, [2,3,4,5]));
    document.querySelectorAll('.tag p').forEach(p => mark(p, [2,3,6,7,8]));
  </script>
</body>
</html>
