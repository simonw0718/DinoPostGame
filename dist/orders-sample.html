<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <title>郵局任務單・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css">
  <script src="shared.js"></script>
  <style>
    /* 郵局任務單 可玩 sample（導演 2026-11-05）
       一天＝3 輪；一輪＝檢查（小桌 3 包裹，把合規定的拉給阿暴蓋章）→送信（拖包裹給符合敘述的收件人）。
       場景座標 840×1080；手機較高時，舞台往下延伸地板，小桌／包裹／提示貼齊底部。 */
    :root{--ink:#24634a;--cream:#fffdf3;--ok:#3d9a5b;--no:#e0533f;--wood:#8a5a2f;--key:#c4471e;--gold:#f2c14e;--ease:cubic-bezier(.16,1,.3,1)}
    html,body{margin:0;height:100%;background:#164d39;font-family:"Naikai",ui-rounded,"Noto Sans TC",sans-serif;color:var(--ink)}
    ::selection{background:var(--gold);color:#24382c}
    .or-shell{max-width:900px;margin:0 auto;padding:0 12px max(12px,env(safe-area-inset-bottom));height:100svh;box-sizing:border-box;display:flex;flex-direction:column}
    .or-stage{position:relative;flex:1;min-height:0;width:min(100%,calc((100svh - 96px)*840/1080));margin:0 auto;border-radius:26px;overflow:hidden;border:4px solid #e9dfc6;box-shadow:0 10px 26px rgba(0,0,0,.28);background:#e9d3a0;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size}
    /* 注音 */
    .kid-text{display:inline-flex;align-items:center;justify-content:center;flex-wrap:nowrap;column-gap:.01em;vertical-align:middle}
    .bpm-word{display:inline-flex;align-items:center;padding-right:.14em;white-space:nowrap}
    .bpm-main-char{font-size:1em;font-weight:900;line-height:1}
    .bpm-column{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:.05em;font-size:.36em;font-weight:800;line-height:1;color:currentColor}
    .bpm-onset,.bpm-rime{display:block;line-height:1.03}
    .bpm-tone{position:absolute;right:-.55em;top:85%;transform:translateY(-50%) scale(1.5,1.8);font-size:1.2em;font-weight:900;color:#d32f2f;line-height:1;height:1em;display:flex;align-items:center}
    .bpm-tone-dot{position:absolute;right:0;top:-.6em;font-size:1.4em;font-weight:900;color:#d32f2f;line-height:1}

    /* 兩個場景：counter／front，各自＝上方 840×1080 場景框＋下方地板延伸＋貼底層 */
    .view{position:absolute;inset:0;transition:opacity .45s var(--ease),transform .6s var(--ease)}
    .front{opacity:0;transform:translateX(12%);pointer-events:none}
    .s-front .front{opacity:1;transform:none;pointer-events:auto}
    .s-front .counter{opacity:0;transform:translateX(-12%);pointer-events:none}
    .floor{position:absolute;left:0;right:0;bottom:0;top:calc(100cqw*1080/840 - 2px);background:url(assets/orders/counter_bg_floor.webp) center top/100% auto repeat-y}
    .front .floor{background-image:url(assets/orders/front_bg_floor.webp)}
    .scene{position:absolute;left:0;top:0;width:100%;aspect-ratio:840/1080}
    .cam{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .9s var(--ease)}
    .lay,.sp{position:absolute}
    .lay{inset:0;width:100%;height:100%}
    .sp{left:calc(var(--x)/840*100%);top:calc(var(--y)/1080*100%);width:calc(var(--w)/840*100%)}
    .sp img{display:block;width:100%;height:auto}
    /* 貼底層：840×400 座標（等於場景 y 680–1080） */
    .bot{position:absolute;left:0;right:0;bottom:0;aspect-ratio:840/400;transform:scale(var(--k,1));transform-origin:50% 100%}
    /* 拖拉中／已交給阿暴的包裹要蓋在櫃台桌面（z3）之上，平常小桌留在櫃台下面 */
    .bot:has(.pc.drag,.pc.done,.pc.back){z-index:5}
    .bp{position:absolute;left:calc(var(--x)/840*100%);top:calc(var(--y)/400*100%);width:calc(var(--w)/840*100%)}
    .bp img{display:block;width:100%}

    /* 公布欄與規則 */
    .board{--x:34;--y:84;--w:556;z-index:2}
    .board h2{position:absolute;left:50%;top:-3.5%;transform:translateX(-50%) rotate(-1deg);margin:0;padding:.18em .9em .24em;border-radius:14px;background:var(--cream);border:4px solid var(--wood);color:var(--ink);font-size:clamp(14px,2.7cqw,22px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.18)}
    .note{position:absolute;left:7%;top:15%;width:86%;transform:rotate(-1.2deg)}
    .note img{width:100%}
    .rule{position:absolute;inset:13% 9% 9%;display:flex;flex-direction:column;justify-content:center;gap:.24em;color:#2b2a27;font-size:clamp(17px,4.4cqw,38px);font-weight:900;line-height:1.15}
    .rule .r1{align-self:flex-start}
    .rule .r2{align-self:center;display:flex;align-items:center;gap:.22em;flex-wrap:wrap;justify-content:center}
    .rule .r3{align-self:flex-end}
    .rule[data-n="2"]{font-size:clamp(15px,3.7cqw,32px)}
    .rule[data-n="3"]{font-size:clamp(13px,3.1cqw,27px)}
    .chip{display:inline-flex;padding:.12em .32em .16em;border:.12em solid var(--key);border-radius:.4em;background:#fff6e4;color:var(--key)}
    .rule .or{font-size:.7em;color:#7a6a55}
    .chick{--x:600;--y:262;--w:196;z-index:1}
    .desk{--x:74;--y:448;--w:692;z-index:3}
    .zone{position:absolute;z-index:4;left:calc(380/840*100%);top:calc(370/1080*100%);width:calc(220/840*100%);height:calc(124/1080*100%);border:4px dashed var(--cream);border-radius:18px;background:rgba(36,99,74,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);font-size:clamp(14px,2.6cqw,21px);font-weight:900;transition:transform .2s,background .2s,opacity .3s}
    .zone img{width:24%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
    .zone.hot{transform:scale(1.07);background:rgba(242,193,78,.8)}
    .table{--x:62;--y:118;--w:716;z-index:1}

    /* 包裹 */
    .pc{position:absolute;z-index:6;left:calc(var(--x)/840*100%);top:calc(var(--y)/400*100%);width:calc(170/840*100%);aspect-ratio:249/201;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;transition:opacity .3s}
    .pc img{position:absolute;pointer-events:none}
    .pc .bx{inset:0;width:100%;height:100%}
    .pc .st{top:30%;width:19%}
    .pc .str{left:12%;top:-12%;width:80%}
    .pc .stk{left:8%;top:52%;width:24%}
    .pc.enter{animation:drop .5s var(--ease) both}
    @keyframes drop{from{translate:0 -40%;opacity:0}}
    .pc.drag{cursor:grabbing;z-index:20;filter:drop-shadow(0 14px 10px rgba(0,0,0,.3))}
    .pc.back{transition:transform .35s var(--ease)}
    .pc.shake{animation:shake .4s}
    @keyframes shake{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
    .pc.done,.pc.given{transition:left .3s,top .3s,width .35s,transform .3s;pointer-events:none}
    .pc .ink{position:absolute;left:30%;top:14%;width:44%;aspect-ratio:1;border:5px solid var(--no);border-radius:50%;color:var(--no);display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.6cqw,22px);font-weight:900;transform:rotate(-14deg) scale(2);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s;background:rgba(255,253,243,.6)}
    .pc.done .ink,.pc.inked .ink{transform:rotate(-14deg) scale(1);opacity:1}
    /* 送信畫面左下的包裹：自然晃動＋微微發光 */
    .pc.hold{animation:sway 2.6s ease-in-out infinite,glow 2.6s ease-in-out infinite}
    @keyframes sway{0%,100%{rotate:-3deg;translate:0 0}50%{rotate:3deg;translate:0 -4%}}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,230,140,.5)) drop-shadow(0 6px 6px rgba(0,0,0,.2))}50%{filter:drop-shadow(0 0 16px rgba(255,220,110,.95)) drop-shadow(0 6px 6px rgba(0,0,0,.2))}}
    .pc.hold.drag,.pc.hold.given{animation:none}
    /* 送信畫面：收件人腳下到提示之間的空地，包裹置中、依空間放大（手機會比較大） */
    .free{position:absolute;z-index:11;left:0;right:0;top:calc(100cqw*1080/840*.85);bottom:calc(max(10px,1.6%) + 52px);container-type:size}
    .free .pc{--pw:min(44cqw,92cqh*249/201);width:var(--pw);left:calc(50% - var(--pw)/2);top:calc(50% - var(--pw)*201/498)}

    /* 介面 */
    .hud{position:absolute;inset:0;pointer-events:none;z-index:20}
    .stamps{position:absolute;left:3%;top:12px;display:flex;gap:5px}
    .stamps i{width:clamp(18px,3.4cqw,28px);aspect-ratio:5/6;border:3px dashed #c9b48a;border-radius:3px;background:rgba(255,253,243,.7);transition:background .3s}
    .stamps i.done{border-style:solid;border-color:#fffdf3;background:var(--gold);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
    .ask{position:absolute;z-index:7;left:50%;bottom:max(10px,1.6%);transform:translateX(-50%);padding:8px 20px;border-radius:99px;background:var(--cream);border:3px solid var(--wood);font-size:clamp(16px,3cqw,25px);font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;transition:opacity .3s}
    @container (max-width:520px){.ask{left:calc(50% + 22px)}}
    .say{position:absolute;padding:8px 14px;border-radius:18px;background:var(--cream);border:4px solid var(--ink);font-size:clamp(14px,2.6cqw,21px);font-weight:900;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .2s}
    .say.on{opacity:1}
    /* 規則放大（每天開始；按 ? 再看一次） */
    .s-rule .counter .cam{--ox:37%;--oy:12%;transform:scale(1.5)}
    .s-rule .counter .pc,.s-rule .zone,.s-rule .ask{opacity:0;pointer-events:none}
    .bubble,.cutin,.tapgo{position:absolute;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
    .bubble{left:31%;right:4%;top:calc(100cqw*1080/840*.66);padding:16px 20px;background:var(--cream);border:5px solid var(--ink);border-radius:30px;font-size:clamp(19px,3.9cqw,32px);font-weight:900;line-height:1.3;box-shadow:0 8px 18px rgba(0,0,0,.2);transform:translateY(12px)}
    .bubble:before{content:"";position:absolute;left:-30px;top:40%;border:14px solid transparent;border-right:20px solid var(--ink)}
    .bubble.kid-text{display:flex;flex-wrap:wrap;justify-content:flex-start}
    .cutin{left:2%;top:calc(100cqw*1080/840*.6);width:30%;transform:translateY(20%)}
    .cutin img{display:block;width:100%}
    .tapgo{right:6%;top:calc(100cqw*1080/840*.66 - 34px);color:var(--cream);font-size:clamp(16px,3cqw,24px);font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.45)}
    .s-rule .bubble,.s-rule .cutin{opacity:1;transform:none}
    .s-rule .tapgo{opacity:1;animation:nudge 1.2s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(6px)}}
    .s-rule .counter{cursor:pointer}
    .s-rule .chick{opacity:0}

    /* 送信 */
    .tag{position:absolute;z-index:12;left:5%;right:5%;top:calc(100cqw*1080/840*.09);padding:12px 16px 14px;background:var(--cream);border:4px solid #c9b48a;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.18);transform:rotate(-1deg);text-align:center}
    .tag small{display:flex;justify-content:center;font-size:clamp(17px,5cqw,26px);color:var(--wood);font-weight:900}
    .tag p{margin:2px 0 0;display:flex;flex-wrap:wrap;justify-content:center;font-size:clamp(20px,6.2cqw,30px);font-weight:900;line-height:1.3}
    .tag .k{color:var(--key)}
    .cand{z-index:4}
    .cand>img:first-of-type{transform-origin:50% 100%}
    .cand .letter{position:absolute;height:auto}
    .cand.hot>img:first-of-type{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 4px #fffdf3)}
    .cand.no>img:first-of-type{animation:nope .5s}
    @keyframes nope{0%,100%{rotate:0deg}25%{rotate:-5deg}50%{rotate:5deg}75%{rotate:-3deg}}
    .cand.yes{animation:hop .6s cubic-bezier(.3,1.5,.5,1)}
    @keyframes hop{0%,100%{translate:0 0}40%{translate:0 -9%}}
    .cand.enter{animation:walkin .55s var(--ease) both}
    @keyframes walkin{from{opacity:0;translate:0 6%}}
    .ring{position:absolute;inset:auto 6% -3% 6%;height:7%;border-radius:50%;background:rgba(36,99,74,.2)}

    /* 開始／結束（同其他遊戲） */
    .overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;background:#0e3a28aa}
    .overlay[hidden]{display:none}
    .pick{display:flex;align-items:center;gap:8px;padding:8px 14px;border:4px solid var(--gold);border-radius:999px;background:var(--cream);box-shadow:0 5px 0 #c89c52}
    .pick button{min-width:72px;min-height:56px;padding:4px 12px;border:3px solid #cfe0c8;border-radius:16px;background:#f1f7ea;font:1000 clamp(18px,5vw,24px) "Naikai",sans-serif;color:var(--ink)}
    .pick button[aria-pressed="true"]{background:linear-gradient(#ffca58,#f6ac34);border-color:#b9792b;color:#573e1d;box-shadow:0 3px 0 #b9792b}
    .start{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0;border:0;background:none;font:inherit;color:var(--ink)}
    .go{display:grid;place-items:center;width:128px;height:128px;border:7px solid var(--cream);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a6e,#e0473a 60%,#b8322a);color:var(--cream);box-shadow:0 8px 0 #8e2620,0 14px 24px #0a2a1c55;animation:breathe 1.6s ease-in-out infinite alternate}
    .go svg{width:56px;height:56px;margin-left:8px}
    .start:active .go{transform:translateY(5px);box-shadow:0 3px 0 #8e2620}
    .label{display:flex;white-space:nowrap;padding:10px 20px;border:4px solid var(--gold);border-radius:999px;background:var(--cream);font-size:clamp(18px,5.2vw,28px);font-weight:1000;box-shadow:0 5px 0 #c89c52}
    .card{display:grid;justify-items:center;gap:10px;width:min(92vw,420px);padding:22px;border:6px solid var(--gold);border-radius:28px;background:var(--cream);text-align:center;box-shadow:0 12px 0 #c89c52;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
    .card img{height:140px}
    .card h2{margin:0;font-size:clamp(22px,6vw,34px);display:flex;justify-content:center}
    .stars{margin:0;color:#f2b945;font-size:44px;letter-spacing:.08em;text-shadow:0 3px 0 #c98a12}
    .stars .off{color:#e6dcc4;text-shadow:none}
    .actions{display:flex;gap:12px;width:100%}
    .actions button,.actions a{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;font:1000 clamp(17px,4.8vw,22px) "Naikai",sans-serif;text-decoration:none;color:var(--ink)}
    .actions button{background:linear-gradient(#ffca58,#f6ac34);box-shadow:0 5px 0 #b9792b}
    .actions a{background:#e5f2df;box-shadow:0 5px 0 #a9c8a2}
    @keyframes pop{from{transform:scale(.85)}}
    @keyframes breathe{to{transform:scale(1.06)}}
    @media (prefers-reduced-motion:reduce){
      .pc.hold,.go,.s-rule .tapgo,.cand.enter,.pc.enter,.cand.yes,.cand.no>img{animation:none}
      .cam,.view{transition-duration:.01s}
    }
  </style>
</head>
<body>
  <div class="or-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">郵局任務單</h1>
      <div class="gh-tools"><button id="help" class="gh-btn" type="button" aria-label="再看一次今天的規定">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="難度選單"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>

    <div id="stage" class="or-stage">
      <!-- 櫃台：公布欄＋阿暴＋蓋章區；小桌在貼底層 -->
      <section class="view counter" id="counter">
        <div class="floor"></div>
        <div class="scene"><div class="cam">
          <img class="lay" src="assets/orders/counter_bg.webp" alt="">
          <div class="sp board"><img src="assets/orders/board.webp" alt=""><h2 data-k="今天的規定">今天的規定</h2>
            <div class="note"><img src="assets/orders/board_note.webp" alt="">
              <div class="rule" id="rule"><span class="r1" data-k="今天不收">今天不收</span><span class="r2" id="conds"></span><span class="r3" data-k="的包裹">的包裹</span></div></div></div>
          <div class="sp chick"><img id="chickImg" src="assets/orders/chick_abao__front__stand_happy.webp" alt="小雞阿暴"></div>
          <div class="sp desk"><img src="assets/orders/counter_desk.webp" alt=""></div>
          <div class="zone" id="zone"><img src="assets/orders/stamp.webp" alt=""><span data-k="蓋章">蓋章</span></div>
        </div></div>
        <div class="bot" id="tableBot"><div class="bp table"><img src="assets/orders/table.webp" alt=""></div></div>
        <div class="ask" data-k="把可以寄的包裹拉給阿暴">把可以寄的包裹拉給阿暴</div>
        <div class="cutin"><img src="assets/orders/chick_abao__proud__happy__open.webp" alt=""></div>
        <div class="bubble" id="bubble"></div>
        <div class="tapgo" aria-hidden="true">▶</div>
      </section>

      <!-- 送信：收件人敘述＋3 位收件人（身高照製作庫 character_scale）；包裹在左下 -->
      <section class="view front" id="front">
        <div class="floor"></div>
        <div class="scene"><div class="cam">
          <img class="lay" src="assets/orders/front_bg.webp" alt="">
          <img class="lay" src="assets/orders/front_door_l.webp" alt="">
          <img class="lay" src="assets/orders/front_door_r.webp" alt="">
          <div id="cands"></div>
        </div></div>
        <div class="tag"><small data-k="要寄給誰呢？">要寄給誰呢？</small><p id="desc"></p></div>
        <div class="free" id="frontBot"></div>
        <div class="ask" data-k="把包裹交給收件人">把包裹交給收件人</div>
      </section>

      <div class="hud"><div class="stamps" id="stamps"></div><div class="say" id="say"></div></div>
    </div>
  </div>

  <div id="ready" class="overlay">
    <div class="pick" role="group" aria-label="難度"><button type="button" data-level="1" aria-pressed="true">新手</button><button type="button" data-level="2" aria-pressed="false">簡單</button><button type="button" data-level="3" aria-pressed="false">困難</button></div>
    <button id="start" class="start" type="button">
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z"/></svg></span><span class="label" data-k="點一下，開始上班！">點一下，開始上班！</span>
    </button>
  </div>
  <div id="finish" class="overlay" hidden>
    <div class="card">
      <img src="assets/orders/chick_abao__front__proud.webp" alt="小雞阿暴">
      <h2 data-k="今天的包裹都送到了！">今天的包裹都送到了！</h2>
      <p id="finishStars" class="stars"></p>
      <div class="actions"><button id="again" type="button">再玩一天</button><a href="index.html">回首頁</a></div>
    </div>
  </div>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const S = 'assets/orders/';
    const stage = $('stage');
    const pick = a => a[Math.floor(Math.random() * a.length)];

      const xs = shuffle([150, 420, 690]);
      rs.forEach((r, i) => {
        const h = r.h * H, w = h * r.ar, x = Math.max(4 + (r.car ? 60 : 0), Math.min(836 - w, xs[i] - w / 2));   // 玩具車在卡片左外側，留位置
        const d = document.createElement('div'); d.className = 'sp cand enter';
        d.style.cssText = `--x:${x};--y:${900 - h};--w:${w};animation-delay:${.15 + i * .1}s;z-index:${4 + Math.round(10 - r.h * 5)}`;
        d.dataset.ok = i === ti;
        d.innerHTML = `<span class="ring"></span><img src="${S}${r.img}.webp" alt="${Object.values(FEATS).map(F => F.say(F.get(r))).filter(Boolean).join('、')}">`;
        propBoxes(r).forEach(({ k, src, box: [x0, y0, x1] }) => d.insertAdjacentHTML(k === 'car' ? 'afterbegin' : 'beforeend', `<img class="letter p-${k}" style="left:${x0}%;top:${y0}%;width:${x1 - x0}%" src="${S}${src}.webp" alt="">`));
        box.append(d);
      });
      const bot = $('frontBot'); bot.replaceChildren();
      const el = parcelEl(G.parcel, 0, 0, 'hold inked'); bot.append(el);
      const cands = [...box.children];
      const under = e => { const c = center(e); return cands.find(k => inside(c, k.querySelector('img'))); };
      draggable(el, {
        over: e => { const h = under(e); cands.forEach(k => k.classList.toggle('hot', k === h)); },
        drop: e => {
          const k = under(e); cands.forEach(x => x.classList.remove('hot'));
          if (k && k.dataset.ok === 'true') {
            G.busy = true; e.classList.add('given'); moveTo(e, k.querySelector('img'), .55, .7);
            k.classList.remove('enter'); k.classList.add('yes'); Dino.sfx('correct', .7); say(k.querySelector('img'), '謝謝你！'); stepDone();
            setTimeout(nextRound, 1500);
          } else {
            goBack(e);
            if (k) { G.miss++; k.classList.remove('no', 'enter'); void k.offsetWidth; k.classList.add('no'); Dino.sfx('wrong', .45); say(k.querySelector('img'), '不是我喔！'); }
          }
        }
      });
      stage.classList.add('s-front'); Dino.sfx('swoosh', .45);
      setTimeout(() => { G.busy = false; }, 650);
    }

    function nextRound() {
      if (++G.round >= ROUNDS) return finish();
      startRound(); setTimeout(() => { G.busy = false; }, 650);
    }
    function finish() {
      const stars = G.miss <= 1 ? 3 : G.miss <= 4 ? 2 : 1;
      $('finishStars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(3 - stars)}</span>`;
      $('finish').hidden = false; Dino.sfx('finish', .8); Dino.bgm.start();
    }
    function newDay() {
      G.rule = makeRule(G.level); G.round = 0; G.miss = 0; G.step = 0;
      drawStamps(); startRound(); showRule();
    }

    // ── 選單（同其他遊戲：開始畫面兼難度選單） ──
    document.querySelectorAll('.pick button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.pick button').forEach(x => x.setAttribute('aria-pressed', x === b)); G.level = +b.dataset.level; Dino.sfx('tap', .5);
    }));
    $('start').addEventListener('click', () => { $('ready').hidden = true; Dino.bgm.stop(); newDay(); });
    $('again').addEventListener('click', () => { $('finish').hidden = true; Dino.bgm.stop(); newDay(); });
    $('menuBtn').addEventListener('click', () => { Dino.sfx('tap', .5); $('ready').hidden = false; Dino.bgm.start(); });
    $('help').addEventListener('click', () => { if (!G.rule || stage.classList.contains('s-front') || stage.classList.contains('s-rule')) return; Dino.sfx('tap', .5); showRule(); });
    Dino.menuTaps($('ready')); Dino.menuTaps($('finish'));
    Dino.bgm.start();
    drawStamps();
    ['chick_abao__front__proud', ...CAST.flatMap(c => c.v.map(v => v.img)), 'letter', 'parcel_yellow', 'parcel_blue', 'parcel_green', 'string', 'sticker_star', 'sticker_heart', 'front_bg', 'front_door_l', 'front_door_r', 'front_bg_floor'].forEach(n => { const i = new Image(); i.src = S + n + '.webp'; });
  })();
  </script>
</body>
</html>
