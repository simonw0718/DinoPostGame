<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>注音送信・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/naikai-subset.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fx.css"><link rel="stylesheet" href="finish-card.css?v=5"><link rel="stylesheet" href="zhuyin-sort.css?v=20"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css"><link rel="stylesheet" href="howto.css?v=6"><link rel="stylesheet" href="preview.css?v=3">
  <script src="vendor/interact.min.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="shared.js" defer></script><script src="progress.js" defer></script><script src="zhuyin-sort.js?v=21" defer></script>
</head>
<body>
  <!-- 導演 2026-10-21 核准 mail-sample v10 後套用：紅郵筒之字排（手機 375×812 舞台）／寬螢幕一排版（900×562） -->
  <div class="ms-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="gameTitle" class="gh-title">注音送信</h1>
      <div class="gh-tools"><button id="helpButton" class="gh-btn" type="button" aria-label="玩法">?</button><button id="settingsButton" class="gh-btn" type="button" aria-label="設定"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>
    <ol id="progress" class="ms-progress" aria-label="送信進度"></ol>
    <div id="play" class="ms-play">
    <main id="stage" class="ms-stage">
      <div id="mailboxes" class="ms-mailboxes" role="group" aria-label="三個圖片郵箱"></div>
      <div id="actor" class="ms-actor" aria-hidden="true">
        <span class="ms-actor-shadow"></span>
        <div class="ms-actor-bob"><img id="actorImg" alt=""></div>
      </div>
      <p id="status" class="ms-bubble" role="status" aria-live="polite"></p>
      <button id="nextButton" class="ms-next" type="button" hidden><span id="nextLabel">下一封</span><span aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-next"/></svg></span></button>
      <div id="ghost" class="ms-ghost" aria-hidden="true" hidden><i style="left:206px;top:700px"></i><i style="left:188px;top:670px"></i><i style="left:170px;top:640px"></i><i style="left:152px;top:610px"></i><i style="left:134px;top:580px"></i><span class="ms-hand"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-hand"/></svg></span></div>
      <div id="letter" class="ms-letter" data-no-press tabindex="0" role="button" aria-label="拿起注音信件">
        <div id="letterFace" class="ms-letter-face">
          <span class="letter-edge" aria-hidden="true"></span>
          <span class="letter-stamp" aria-hidden="true"><img src="assets/dinopost-workmark-master.jpg" alt=""></span>
          <strong id="reading" class="letter-reading"></strong>
          <span id="letterArt" class="letter-art" hidden></span>
        </div>
      </div>
      <button id="replayButton" class="ms-replay" type="button" aria-label="播放中文發音"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sound"/></svg></button>
      <div id="receipt" class="ms-receipt" hidden>
        <span class="back-fold" aria-hidden="true"></span>
        <span class="back-label"><span id="receiptBrand">恐龍郵局</span> · <span id="receiptConfirm">收件確認</span></span>
        <strong id="receiptZh" class="back-chinese"></strong>
        <span id="receiptEn" class="back-english"></span>
        <span id="postmark" class="back-postmark" aria-hidden="true"><img src="assets/dinopost-workmark-stamp-transparent-v1.webp" alt=""></span>
      </div>
    </main>
    </div>
  </div>

  <!-- B 流程（導演 2026-11-10）：進頁就是遊戲畫面＋開始浮層（選項＋紅色播放鈕）；按播放才開始第一題並播音 -->
  <div id="readyOverlay" class="ready-tap">
    <div class="ready-pick" role="group" aria-label="信件內容"><button type="button" data-fmt="zhuyin" aria-pressed="true">看注音</button><button type="button" data-fmt="picture" aria-pressed="false">看圖片</button></div>
    <div id="levelPick" class="ready-pick" role="group" aria-label="難度"><button type="button" data-lv="all" aria-pressed="true">全部</button><button type="button" data-lv="1" aria-pressed="false">1</button><button type="button" data-lv="2" aria-pressed="false">2</button><button type="button" data-lv="3" aria-pressed="false">3</button></div>
    <button id="readyStart" class="ready-start" type="button" aria-label="點一下，開始送信">
      <span class="ready-go" aria-hidden="true"><span class="ready-ring"></span><span class="ready-ring r2"></span><span class="ready-icon"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-play"/></svg></span></span>
      <span id="readyTitle" class="ready-label">點一下，開始送信！</span>
    </button>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="dialog-head"><span aria-hidden="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-letter"/></svg></span><h2>遊戲設定</h2><button id="closeSettings" class="close-button" type="button" aria-label="關閉設定"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-close"/></svg></button></div>
    <p class="setting-note">信件內容、發音與封數會在下一回合生效；題庫及作答紀錄與配對遊戲共用。</p>
    <fieldset class="mail-format-picker"><legend>信件內容</legend><div class="mail-format-options"><button class="mail-format-option" type="button" data-mail-format="zhuyin" aria-pressed="true">看注音</button><button class="mail-format-option" type="button" data-mail-format="picture" aria-pressed="false">看圖片</button></div></fieldset>
    <label class="auto-audio-control mail-auto-control"><input id="mailAutoAudio" type="checkbox" checked><span class="switch-track" aria-hidden="true"></span><span class="switch-label">自動發音</span></label>
    <label class="mail-count-label" for="mailCount">每回合封數：<output id="mailCountValue">5</output></label><input id="mailCount" type="range" min="3" max="10" value="5" aria-label="每回合封數">
    <fieldset class="mail-mode-picker"><legend>選任務</legend><div class="mail-mode-options">
      <button class="mail-mode-option" type="button" data-mail-mode="all" aria-pressed="true"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-sparkle"/></svg> 全部</button>
      <button class="mail-mode-option" type="button" data-mail-mode="level" aria-pressed="false">1–3 分難度</button>
      <button class="mail-mode-option" type="button" data-mail-mode="dinosaur" aria-pressed="false"><svg class="di" aria-hidden="true"><use href="icons.svg#ic-dino"/></svg> 恐龍挑戰</button>
    </div></fieldset>
    <div id="mailLevelControl" class="mail-level-control" hidden><label id="mailLevelText" for="mailLevelSlider">第一級</label><input id="mailLevelSlider" type="range" min="1" max="3" step="1" value="1" aria-label="選擇難度等級"><div class="mail-level-marks" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div></div>
    <p id="mailSelectionSummary" class="mail-selection-summary">下一回合：全部單字</p>
    <button id="restartFromSettings" class="settings-restart" type="button">重新開始這回合</button>
    <a class="settings-link" href="match.html?settings=bank"><span><strong>題庫管理</strong><small>選擇可出現的單字</small></span><span aria-hidden="true">›</span></a>
    <a class="settings-link" href="match.html?settings=history"><span><strong>作答紀錄</strong><small>查看最近 10 回合</small></span><span aria-hidden="true">›</span></a>
  </dialog>

  <div id="finishOverlay" class="overlay" hidden>
    <div class="card">
      <img src="assets/dinopost-workmark-stamp-transparent-v1.webp" alt="" class="finish-mark">
      <h2 id="finishTitle">送信任務完成</h2>
      <p id="finishCopy">信都送到了！</p>
      <p id="finishStars" class="stars"></p>
      <p id="finishScore" class="finish-score"></p>
      <div class="actions"><button id="playAgainButton" type="button">再送一次</button><a id="finishHome" href="index.html">回首頁</a></div>
    </div>
  </div>
</body>
</html>
