  <div class="cl-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">樹洞大賽跑</h1>
      <div class="gh-tools"><button id="help" class="gh-btn" type="button" aria-label="玩法">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="難度選單"><svg aria-hidden="true"><use href="icons.svg#ic-gear"/></svg></button></div>
    </header>

    <main id="view" class="cl-view">
      <div id="world">
        <img class="layer" id="bgImg" src="assets/climb/bg.webp" alt="">
        <img class="layer" id="fgImg" src="assets/climb/fg.webp" alt="">
      </div>
      <div id="bubble" hidden role="status" aria-live="polite"><img id="bubbleWho" alt=""><p id="bubbleText"></p></div>
      <div id="diceWrap" class="dice-wrap"></div>
      <button id="rollBtn" type="button" aria-label="丟骰子" hidden></button>
      <button id="wrong" type="button" hidden>不對！</button>
      <div id="stamps" hidden><img src="assets/dinopost-workmark-stamp-transparent-v1.webp" alt="郵票"><b id="stampN">0</b></div>
    </main>
  </div>

  <div id="ready" class="overlay first">
    <div class="pick" role="group" aria-label="難度"><button type="button" data-lv="one" id="pickOne">簡單</button><button type="button" data-lv="two" id="pickTwo">普通</button><button type="button" data-lv="hard" id="pickHard">困難</button></div>
    <div id="rule" class="rule" aria-live="polite"></div>
    <button id="start" type="button"><span class="go" aria-hidden="true"><svg viewBox="0 0 40 40" width="58" height="58"><use href="#i-play"/></svg></span><span id="startLabel" class="label">點一下，開始比賽！</span></button>
  </div>

  <div id="quiz" class="overlay" hidden><div class="qcard" id="qcard"></div></div>

  <div id="finish" class="overlay" hidden>
    <div class="card">
      <div class="row" id="finishRow"></div>
      <h2 id="finishTitle">信送到了！</h2>
      <p id="finishSub" class="sub">漢默爺爺的樹洞家</p>
      <div id="finishStamps" class="stampline"></div>
      <div class="actions"><button id="again" type="button">再玩一次</button><a id="home" href="index.html">回首頁</a></div>
    </div>
  </div>

<script src="climb.js?v=n5"></script>
</body>
</html>
