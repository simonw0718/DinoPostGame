<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <title>接信大郵袋・恐龍郵局（sample）</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css"><link rel="stylesheet" href="howto.css">
  <script src="shared.js"></script>
  <style>
    /* 接信大郵袋 sample v3（2026-10-22）：左右移郵袋接住指定顏色的信；聽英文顏色、接到時用英文數數。
       v2（導演 2026-10-22「太慢、沒挑戰」）：①每關越來越快 ②接錯退一格 ③金色星星信（+2）與左右飄的調皮信；美術重整天空、信封、郵袋
       v3（導演 2026-10-22）：加形狀 7 種、最後一關顏色＋形狀；不能接的奇怪物品（題庫圖）；郵袋改正面郵件推車＋伊奇站車後 */
    :root{--ink:#17593f;--cream:#fffdf2;--gold:#e3bd70;--sky-a:#8fd0f2;--sky-b:#d9f1fb;--grass:#7cc46a;--grass-d:#4f9f55;font-family:"Naikai",ui-rounded,"Noto Sans TC",system-ui,sans-serif;color:var(--ink)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:#164d39;overflow:hidden}
    ::selection{background:#ffe08a;color:var(--ink)}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:4px solid #eaa52a;outline-offset:3px}
    .cs-shell{position:relative;display:flex;flex-direction:column;height:100svh;max-width:1200px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));gap:10px;isolation:isolate}
    .cs-shell::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#0f3d2c22,#0f3d2caa 80%),url('assets/mail-bg/grass-slope-wide-village-view.jpg') center/cover no-repeat}

    /* 訂單：要接什麼顏色＋接到幾封 */
    .cs-order{display:flex;align-items:center;justify-content:center;gap:10px 14px;flex:none;flex-wrap:wrap;padding:8px 14px;border:3px solid var(--gold);border-radius:20px;background:var(--cream);box-shadow:0 4px 0 #c89c52,0 8px 16px #0a2a1c33}
    .cs-order.is-pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
    .cs-ask{display:flex;align-items:center;gap:10px;padding:0;border:0;background:none;font-size:clamp(20px,5vw,30px);font-weight:1000}
    .cs-chip{position:relative;flex:none;width:50px;height:36px;border-radius:7px;background:var(--c);border:3px solid color-mix(in srgb,var(--c) 62%,#000);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000)}
    .cs-chip::before{content:"";position:absolute;inset:0;border-radius:4px;background:color-mix(in srgb,var(--c) 70%,#fff);clip-path:polygon(0 0,100% 0,50% 60%)}
    .cs-chip.is-shape{width:42px;height:42px;background:none;border:0;box-shadow:none}
    .cs-chip.is-shape::before{display:none}
    .cs-chip.is-shape svg{display:block;width:100%;height:100%;overflow:visible}
    .cs-ear{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#2b7751;color:#fff;box-shadow:0 3px 0 #17593f}
    .cs-ear svg{width:22px;height:22px}
    .cs-count{display:flex;gap:6px;margin:0;padding:0;list-style:none}
    .cs-count li{width:38px;height:38px;border:3px dashed #d8c08e;border-radius:11px;background:#fff6dd;display:grid;place-items:center;font-size:20px;font-weight:1000;color:#fff;text-shadow:0 2px 0 #0004}
    .cs-count li.is-filled{border-style:solid;border-color:#3d8a5b;background:#4fb46a;animation:slot .4s cubic-bezier(.2,1.5,.4,1)}
    .cs-count li.is-lost{animation:lost .45s ease-out}

    /* 天空：淡藍漸層＋雲＋草地，郵袋站在草地上 */
    .cs-sky{position:relative;flex:1;min-height:0;border:5px solid var(--cream);border-radius:26px;background:linear-gradient(180deg,var(--sky-a),var(--sky-b) 70%,#f2fbff);overflow:hidden;touch-action:none;box-shadow:0 10px 26px #0a2a1c66;isolation:isolate}
    .cs-sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:clamp(26px,7%,48px);z-index:0;background:radial-gradient(circle at 20px 0,var(--grass) 19px,transparent 20px) 0 0/40px 100% repeat-x,linear-gradient(var(--grass),var(--grass-d));background-position:0 -8px,0 10px;background-size:40px 22px,100% 100%;background-repeat:repeat-x,no-repeat}
    .sun{position:absolute;right:9%;top:8%;width:clamp(54px,12vw,96px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6c9,#ffe07a 60%,#ffd25e00 72%);z-index:0}
    .cloud{position:absolute;z-index:0;width:110px;height:26px;border-radius:99px;background:#fffefa;opacity:.92;box-shadow:24px -12px 0 4px #fffefa,52px -2px 0 #fffefa;animation:drift 18s ease-in-out infinite alternate}
    .cloud.c1{left:6%;top:14%}
    .cloud.c2{left:auto;right:24%;top:34%;transform:scale(.6);animation-duration:24s;animation-direction:alternate-reverse}
    .cs-rounds{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px;margin:0;padding:6px 9px;list-style:none;border-radius:99px;background:#fffdf2cc;box-shadow:0 3px 0 #0a2a1c22}
    .cs-rounds li{width:12px;height:12px;border-radius:50%;background:#d6e4cf;transition:background .3s,transform .3s}
    .cs-rounds li.is-done{background:#4fb46a}
    .cs-rounds li.is-now{background:#f2b945;transform:scale(1.35)}

    /* 信封：顏色是 --c，信封蓋用淺一點的同色；角落郵票 */
    .letter{--flap:color-mix(in srgb,var(--c) 55%,#fff);--edge:color-mix(in srgb,var(--c) 62%,#000);position:absolute;left:0;top:0;z-index:1;width:var(--lw);height:calc(var(--lw)*.68);border-radius:9px;border:3px solid var(--edge);box-shadow:0 6px 10px #0a2a1c40;will-change:transform;
      background:linear-gradient(to top right,var(--c) calc(50% - 2px),var(--edge) calc(50% - 2px) 50%,var(--flap) 50%) left top/50.5% 62% no-repeat,linear-gradient(to top left,var(--c) calc(50% - 2px),var(--edge) calc(50% - 2px) 50%,var(--flap) 50%) right top/50.5% 62% no-repeat,var(--c)}
    .letter::after{content:"";position:absolute;right:7%;bottom:11%;width:19%;aspect-ratio:1;border-radius:3px;background:var(--edge);box-shadow:inset 0 0 0 3px #fffdf2}
    .letter.is-wiggly{border-radius:12px}
    .letter.is-wiggly::after{border-radius:50%}
    .letter.is-gold{--c:#ffc21a;width:calc(var(--lw)*1.15);height:calc(var(--lw)*.78);background:linear-gradient(135deg,#fff4b8,#ffc824 38%,#f09a00 62%,#ffe07a);border-color:#9c6200;box-shadow:0 0 0 4px #fffdf2,0 6px 12px #0a2a1c55,0 0 22px 8px #ffb300aa;animation:glow .6s ease-in-out infinite alternate}
    .letter.is-gold::after{display:none}
    .letter.is-gold svg{position:absolute;z-index:1;left:50%;top:50%;width:62%;height:auto;transform:translate(-50%,-44%);filter:drop-shadow(0 2px 0 #b9820f)}
    .item{position:absolute;left:0;top:0;z-index:2;width:var(--lw);height:var(--lw);will-change:transform;filter:drop-shadow(0 5px 4px #0a2a1c44)}
    .item svg{display:block;width:100%;height:100%;overflow:visible}
    .junk{position:absolute;left:0;top:0;z-index:2;width:calc(var(--lw)*1.08);height:calc(var(--lw)*1.08);will-change:transform;mix-blend-mode:multiply}   /* 題庫圖是米白底：multiply 讓底色消失（不能加 filter，會擋住混色） */
    .junk img{display:block;width:100%;height:100%;object-fit:contain}
    .letter{z-index:2}
    .spark{position:absolute;z-index:1;width:10px;height:10px;pointer-events:none;background:#fff6b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .6s ease-out forwards}

    /* 伊奇站在郵件推車後面（露胸口以上）：伊奇 z1 → 掉落物 z2 → 推車正面 z3，信看起來掉進車裡 */
    .iggy,.cart{position:absolute;left:0;bottom:0;width:var(--bw);will-change:transform;pointer-events:none}
    .iggy{z-index:1;height:calc(var(--ch)*1.75);bottom:calc(var(--ch)*.15)}
    .iggy img{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);filter:drop-shadow(0 4px 4px #0a2a1c33)}
    .cart{z-index:3;height:var(--ch)}
    .cart img{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 6px #0a2a1c44)}
    .cart.is-yes{animation:gulp .35s}
    .cart.is-no{animation:wobble .4s}
    .iggy.is-yes{animation:hop .4s}
    .float{position:absolute;z-index:4;font-size:36px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #17593f;pointer-events:none;animation:rise .9s ease-out forwards}
    .float.is-minus{color:#ffd9d2;text-shadow:0 3px 0 #b8322a}
    .float.is-gold{font-size:44px;color:#fff3a8;text-shadow:0 3px 0 #a86f00}
    .banner{position:absolute;left:50%;top:38%;z-index:5;display:grid;justify-items:center;gap:4px;padding:12px 26px;border:5px solid var(--gold);border-radius:24px;background:var(--cream);box-shadow:0 7px 0 #c89c52,0 14px 26px #0a2a1c55;font-size:clamp(28px,8vw,42px);font-weight:1000;pointer-events:none;transform:translate(-50%,-50%);animation:banner 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
    .banner small{color:#e0473a;font-size:.62em}

    .bpm-word{display:inline-flex;align-items:center;justify-content:center;flex:none;padding-right:.26em;white-space:nowrap}
    .bpm-main-char{display:inline-block;flex:none;font-size:1em;line-height:1.04}
    .bpm-column{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;margin-left:.05em;font-size:.4em;font-weight:850;line-height:1}
    .bpm-onset,.bpm-rime{display:block;line-height:1.03}
    .bpm-tone{position:absolute;right:-.55em;top:85%;transform:translateY(-50%) scale(1.5,1.8);font-size:1.2em;font-weight:900;color:#d32f2f;line-height:1}
    .bpm-tone-dot{position:absolute;right:0;top:-.6em;font-size:1.4em;font-weight:900;color:#d32f2f;line-height:1}

    .overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;background:#0e3a28aa}
    .overlay[hidden]{display:none}
    .pick{display:flex;align-items:center;gap:8px;padding:8px 14px;border:4px solid var(--gold);border-radius:999px;background:var(--cream);font-size:clamp(18px,5vw,24px);font-weight:1000;box-shadow:0 5px 0 #c89c52}
    .pick button{min-width:64px;min-height:52px;padding:4px 12px;border:3px solid #cfe0c8;border-radius:16px;background:#f1f7ea}
    .pick button[aria-pressed="true"]{background:linear-gradient(#ffca58,#f6ac34);border-color:#b9792b;color:#573e1d;box-shadow:0 3px 0 #b9792b}
    .start{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0;border:0;background:none}
    .go{display:grid;place-items:center;width:128px;height:128px;border:7px solid var(--cream);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a6e,#e0473a 60%,#b8322a);color:var(--cream);box-shadow:0 8px 0 #8e2620,0 14px 24px #0a2a1c55;animation:breathe 1.6s ease-in-out infinite alternate}
    .go svg{width:56px;height:56px;margin-left:8px}
    .start:active .go{transform:translateY(5px);box-shadow:0 3px 0 #8e2620}
    .label{white-space:nowrap;padding:10px 20px;border:4px solid var(--gold);border-radius:999px;background:var(--cream);font-size:clamp(18px,5.2vw,28px);font-weight:1000;box-shadow:0 5px 0 #c89c52}
    .card{display:grid;justify-items:center;gap:10px;width:min(92vw,400px);padding:22px;border:6px solid var(--gold);border-radius:28px;background:var(--cream);text-align:center;box-shadow:0 12px 0 #c89c52;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
    .card img{height:130px}
    .card h2{margin:0;font-size:clamp(24px,6.4vw,38px);white-space:nowrap;display:flex;justify-content:center}
    .stars{margin:0;color:#f2b945;font-size:44px;letter-spacing:.08em;text-shadow:0 3px 0 #c98a12}
    .stars .off{color:#e6dcc4;text-shadow:none}
    .actions{display:flex;gap:12px;width:100%}
    .actions button,.actions a{flex:1;min-height:54px;display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;font-size:clamp(17px,4.8vw,22px);font-weight:1000;text-decoration:none;color:var(--ink)}
    .actions button{background:linear-gradient(#ffca58,#f6ac34);box-shadow:0 5px 0 #b9792b}
    .actions a{background:#e5f2df;box-shadow:0 5px 0 #a9c8a2}
    @media(max-width:680px){.cs-order{gap:8px 10px;padding:7px 10px}.cs-count li{width:34px;height:34px}.cs-chip{width:44px;height:32px}}

    @keyframes pop{from{transform:scale(.85)}}
    @keyframes slot{from{transform:scale(.3) rotate(-20deg)}}
    @keyframes lost{0%{transform:scale(1.15);background:#ffb4a6;border-color:#e0473a}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}100%{transform:none}}
    @keyframes gulp{40%{scale:1.06 .9}}
    @keyframes hop{40%{translate:0 -10px}}
    @keyframes wobble{25%{rotate:-8deg}75%{rotate:8deg}}
    @keyframes rise{to{transform:translateY(-70px);opacity:0}}
    @keyframes glow{to{box-shadow:0 0 0 4px #fff7c2,0 6px 12px #0a2a1c55,0 0 34px 14px #ffb300cc}}
    @keyframes spark{from{transform:scale(1)}to{transform:translateY(16px) scale(.2);opacity:0}}
    @keyframes drift{to{translate:40px 0}}
    @keyframes banner{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}18%{transform:translate(-50%,-50%) scale(1);opacity:1}78%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
    @keyframes breathe{to{transform:scale(1.06)}}
    @media(prefers-reduced-motion:reduce){.cloud,.go,.letter.is-gold{animation:none}}
  </style>
</head>
<body>
  <div class="cs-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">接信大郵袋</h1>
      <div class="gh-tools"><button id="help" class="gh-btn" type="button" aria-label="玩法">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="速度選單"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button></div>
    </header>
    <div id="order" class="cs-order">
      <button id="ask" class="cs-ask" type="button" aria-label="再聽一次"><span id="chip" class="cs-chip"></span><span id="askText"></span><span class="cs-ear" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.5h3.2L12 5.4v13.2l-4.8-4.1H4z"/><path d="M15.5 8.6a4.6 4.6 0 0 1 0 6.8M18 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span></button>
      <ol id="count" class="cs-count" aria-label="接到幾封"></ol>
    </div>
    <main id="sky" class="cs-sky">
      <span class="sun" aria-hidden="true"></span><span class="cloud c1" aria-hidden="true"></span><span class="cloud c2" aria-hidden="true"></span>
      <ol id="rounds" class="cs-rounds" aria-label="第幾關"></ol>
      <div id="iggy" class="iggy"><img id="courier" alt=""></div>
      <div id="cart" class="cart"><img src="assets/cast/prop_mail_cart_front.webp" alt=""></div>
    </main>
  </div>

  <div id="ready" class="overlay">
    <div class="pick" role="group" aria-label="速度"><button type="button" data-speed="slow" id="pSlow">慢</button><button type="button" data-speed="mid" id="pMid">中</button><button type="button" data-speed="fast" id="pFast">快</button></div>
    <button id="start" class="start" type="button">
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z"/></svg></span><span id="startLabel" class="label">點一下，開始接信！</span>
    </button>
  </div>

  <div id="finish" class="overlay" hidden>
    <div class="card">
      <img id="finishActor" alt="">
      <h2 id="finishTitle">信都接到了！</h2>
      <p id="finishStars" class="stars"></p>
      <div class="actions"><button id="again" type="button">再玩一次</button><a id="home" href="index.html">回首頁</a></div>
    </div>
  </div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const COLORS = [
    { id: 'red', zh: '紅', bpm: 'ㄏㄨㄥˊ', fill: '#e8574a' },
    { id: 'blue', zh: '藍', bpm: 'ㄌㄢˊ', fill: '#3f8fd2' },
    { id: 'yellow', zh: '黃', bpm: 'ㄏㄨㄤˊ', fill: '#f4c63d' },
    { id: 'green', zh: '綠', bpm: 'ㄌㄩˋ', fill: '#4fb46a' }
  ];
  // 形狀＝題庫 shape 主題（星形沿用題庫既有的 star 星星音檔）；path 在 100×100 畫布
  const SHAPES = [
    { id: 'circle', zh: '圓形', bpm: ['ㄩㄢˊ', 'ㄒㄧㄥˊ'], audio: 'shape-circle', d: 'M50 8a42 42 0 1 1 0 84a42 42 0 1 1 0-84z' },
    { id: 'square', zh: '正方形', bpm: ['ㄓㄥˋ', 'ㄈㄤ', 'ㄒㄧㄥˊ'], audio: 'shape-square', d: 'M20 10h60a10 10 0 0 1 10 10v60a10 10 0 0 1-10 10H20a10 10 0 0 1-10-10V20a10 10 0 0 1 10-10z' },
    { id: 'rectangle', zh: '長方形', bpm: ['ㄔㄤˊ', 'ㄈㄤ', 'ㄒㄧㄥˊ'], audio: 'shape-rectangle', d: 'M12 24h76a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V32a8 8 0 0 1 8-8z' },
    { id: 'triangle', zh: '三角形', bpm: ['ㄙㄢ', 'ㄐㄧㄠˇ', 'ㄒㄧㄥˊ'], audio: 'shape-triangle', d: 'M50 9L93 86H7z' },
    { id: 'diamond', zh: '菱形', bpm: ['ㄌㄧㄥˊ', 'ㄒㄧㄥˊ'], audio: 'shape-diamond', d: 'M50 4L84 50L50 96L16 50z' },
    { id: 'heart', zh: '愛心', bpm: ['ㄞˋ', 'ㄒㄧㄣ'], audio: 'shape-heart', d: 'M50 88C18 66 5 49 5 32C5 17 16 7 29 7c9 0 16 5 21 13c5-8 12-13 21-13c13 0 24 10 24 25c0 17-13 34-45 56z' },
    { id: 'star', zh: '星形', bpm: ['ㄒㄧㄥ', 'ㄒㄧㄥˊ'], audio: 'kidapp-star', d: 'M50 5l12 31l33 2l-26 21l9 32l-28-18l-28 18l9-32L5 38l33-2z' }
  ];
  // 不能接的奇怪物品：沿用題庫圖（米白底，用 multiply 融進天空）
  const JUNK = ['emoji-6x8-v1/kidapp-sock', 'new100/new-broom', 'new100/new-mop', 'new100/new-bucket', 'emoji-6x8-v1/object-fork', 'emoji-6x8-v1/object-spoon',
    'new100/new-kettle', 'emoji-6x8-v1/kidapp-mushroom', 'emoji-6x8-v1/kidapp-hammer', 'new100/new-comb', 'new100/new-bottle', 'emoji-6x8-v1/kidapp-pumpkin',
    'new100/new-toaster', 'new100/new-lettuce'].map(p => `assets/rebuilt/${p}.png`);
  const table = {
    '接信大郵袋': ['ㄐㄧㄝ', 'ㄒㄧㄣˋ', 'ㄉㄚˋ', 'ㄧㄡˊ', 'ㄉㄞˋ'],
    '點一下，開始接信！': ['ㄉㄧㄢˇ', 'ㄧ', 'ㄒㄧㄚˋ', '', 'ㄎㄞ', 'ㄕˇ', 'ㄐㄧㄝ', 'ㄒㄧㄣˋ', ''],
    '信都接到了！': ['ㄒㄧㄣˋ', 'ㄉㄡ', 'ㄐㄧㄝ', 'ㄉㄠˋ', 'ㄌㄜ˙', ''],
    '慢': ['ㄇㄢˋ'], '中': ['ㄓㄨㄥ'], '快': ['ㄎㄨㄞˋ'],
    '再玩一次': ['ㄗㄞˋ', 'ㄨㄢˊ', 'ㄧ', 'ㄘˋ'], '回首頁': ['ㄏㄨㄟˊ', 'ㄕㄡˇ', 'ㄧㄝˋ'],
    '奇怪東西不要接': ['ㄑㄧˊ', 'ㄍㄨㄞˋ', 'ㄉㄨㄥ', 'ㄒㄧ˙', 'ㄅㄨˊ', 'ㄧㄠˋ', 'ㄐㄧㄝ'],
    '知道了': ['ㄓ', 'ㄉㄠˋ', 'ㄌㄜ˙'], '變快了！': ['ㄅㄧㄢˋ', 'ㄎㄨㄞˋ', 'ㄌㄜ˙', ''],
    '第二關': ['ㄉㄧˋ', 'ㄦˋ', 'ㄍㄨㄢ'], '第三關': ['ㄉㄧˋ', 'ㄙㄢ', 'ㄍㄨㄢ'], '第四關': ['ㄉㄧˋ', 'ㄙˋ', 'ㄍㄨㄢ'], '最後一關': ['ㄗㄨㄟˋ', 'ㄏㄡˋ', 'ㄧ', 'ㄍㄨㄢ']
  };
  COLORS.forEach(c => { table[`接${c.zh}色的信`] = ['ㄐㄧㄝ', c.bpm, 'ㄙㄜˋ', 'ㄉㄜ˙', 'ㄒㄧㄣˋ']; });
  SHAPES.forEach(sh => {
    table[`接${sh.zh}`] = ['ㄐㄧㄝ', ...sh.bpm];
    COLORS.forEach(c => { table[`接${c.zh}色的${sh.zh}`] = ['ㄐㄧㄝ', c.bpm, 'ㄙㄜˋ', 'ㄉㄜ˙', ...sh.bpm]; });
  });
  const setKidText = Dino.kidText(table);
  const NUM = ['one', 'two', 'three', 'four', 'five'];
  const ROUNDS = [3, 3, 4, 4, 5];   // 每回合要接幾個
  const MODES = ['color', 'shape', 'color', 'shape', 'both'];   // 導演 2026-10-22：顏色、形狀輪流，最後一關顏色＋形狀
  const ROUND_NAMES = [null, '第二關', '第三關', '第四關', '最後一關'];
  // 中速約 3 秒落地；每關再乘 RAMP，最後一關約快 1.6 倍
  const SPEED = { slow: .024, mid: .034, fast: .046 };   // 每毫秒下降幾 % 天空高度
  const GAP = { slow: 1100, mid: 820, fast: 640 };        // 幾毫秒掉一個
  const RAMP = [1, 1.12, 1.25, 1.4, 1.6];
  const TARGET_RATE = .38;   // 要接的比例
  const JUNK_RATE = [.18, .28, .3, .32, .32];   // 奇怪物品比例（推車變大，靠它們補難度）
  const GOLD_RATE = .07;     // 第二關起，金色星星信：什麼都算，+2
  const WIGGLY_RATE = .3;    // 第三關起，左右大幅飄
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fffbe6" stroke="#b9820f" stroke-width="1.6" stroke-linejoin="round" d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
  let speed = 'mid';
  try { const s = localStorage.getItem('dinopost-catch-speed'); if (SPEED[s]) speed = s; } catch { /* ok */ }

  const G = { round: 0, got: 0, wrong: 0, wrongs: [], target: null, pool: [], letters: [], bagX: .5, running: false, paused: false, pending: null, started: false, last: 0, spawnIn: 0 };
  const audio = {};
  function clip(name) { return audio[name] || (audio[name] = new Audio(name.startsWith('shape-') ? `assets/audio/${name}.mp3` : `assets/audio/kidapp-${name.replace(/^kidapp-/, '')}.mp3`)); }
  function play(name) { const a = clip(name); a.currentTime = 0; return a.play().catch(() => {}); }
  // 題目念法：顏色 → "red"；形狀 → "circle"；最後一關 → "red" 接著 "circle"
  let sayT;
  function sayOrder() {
    const t = G.target; clearTimeout(sayT);
    if (t.color && t.shape) { play(t.color.id); sayT = setTimeout(() => play(t.shape.audio), 750); }
    else play(t.color ? t.color.id : t.shape.audio);
  }

  let clipN = 0;
  function shapeSvg(sh, fill) {
    const id = `cl${++clipN}`, edge = `color-mix(in srgb,${fill} 58%,#000)`;
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><path d="${sh.d}"/></clipPath><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient></defs>`
      + `<path d="${sh.d}" fill="${fill}" stroke="${edge}" stroke-width="5" stroke-linejoin="round"/><path d="${sh.d}" fill="url(#${id}g)"/>`
      + `<ellipse cx="36" cy="30" rx="15" ry="8" fill="#fff" opacity=".5" clip-path="url(#${id})"/></svg>`;
  }

  const sky = $('sky'), iggy = $('iggy'), cart = $('cart');
  let W = 0, H = 0, LW = 0, BW = 0, CH = 0;
  function measure() {
    W = sky.clientWidth; H = sky.clientHeight;
    LW = Math.round(Math.max(62, Math.min(110, W * .12)));
    BW = Math.round(Math.max(150, Math.min(290, W * .32)));   // v3：推車約畫面 32%（v2 郵袋 24%）
    CH = Math.round(BW * 278 / 420);
    sky.style.setProperty('--lw', LW + 'px'); sky.style.setProperty('--bw', BW + 'px'); sky.style.setProperty('--ch', CH + 'px');
    placeBag();
  }
  function placeBag() { const t = `translateX(${G.bagX * (W - BW)}px)`; iggy.style.transform = t; cart.style.transform = t; }

  // 手指在天空任何地方左右滑，推車就跟著走
  function follow(e) { const r = sky.getBoundingClientRect(); G.bagX = Math.max(0, Math.min(1, (e.clientX - r.left - BW / 2) / (W - BW))); placeBag(); }
  sky.addEventListener('pointerdown', e => { sky.setPointerCapture(e.pointerId); follow(e); });
  sky.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') follow(e); });
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') G.bagX = Math.max(0, G.bagX - .06); else if (e.key === 'ArrowRight') G.bagX = Math.min(1, G.bagX + .06); else return; placeBag(); });

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function orderText(t) { return t.color && t.shape ? `接${t.color.zh}色的${t.shape.zh}` : t.color ? `接${t.color.zh}色的信` : `接${t.shape.zh}`; }

  function setOrder() {
    const t = G.target, chip = $('chip');
    setKidText($('askText'), orderText(t));
    chip.className = 'cs-chip' + (t.shape ? ' is-shape' : '');
    chip.innerHTML = t.shape ? shapeSvg(t.shape, t.color ? t.color.fill : '#cfc6ad') : '';   // 只考形狀時用中性米灰，不暗示顏色
    chip.style.setProperty('--c', t.color ? t.color.fill : '#fffdf2');
    $('count').replaceChildren(...Array.from({ length: ROUNDS[G.round] }, () => document.createElement('li')));
    $('rounds').replaceChildren(...ROUNDS.map((_, i) => { const li = document.createElement('li'); li.className = i < G.round ? 'is-done' : i === G.round ? 'is-now' : ''; return li; }));
    const o = $('order'); o.classList.remove('is-pop'); void o.offsetWidth; o.classList.add('is-pop');
    sayOrder();
  }
  function syncCount() {
    [...$('count').children].forEach((li, i) => { const on = i < G.got; li.classList.toggle('is-filled', on); li.textContent = on ? i + 1 : ''; });
  }

  // 依本關題型產生一個「對的」或「錯的」東西
  function makeThing(good) {
    const mode = MODES[G.round], t = G.target;
    if (mode === 'color') return { color: good ? t.color : pick(COLORS.filter(c => c !== t.color)) };
    if (mode === 'shape') return { shape: good ? t.shape : pick(G.pool), color: pick(COLORS) };
    if (good) return { shape: t.shape, color: t.color };
    // 最後一關的錯：同形狀不同色、同色不同形狀、都不同，各約三分之一
    const r = Math.random();
    return r < .35 ? { shape: t.shape, color: pick(COLORS.filter(c => c !== t.color)) }
      : r < .7 ? { shape: pick(G.pool), color: t.color } : { shape: pick(G.pool), color: pick(COLORS.filter(c => c !== t.color)) };
  }

  function spawn() {
    const r = G.round, n = document.createElement('div');
    const gold = r >= 1 && !G.letters.some(L => L.kind === 'gold') && Math.random() < GOLD_RATE;
    const junk = !gold && Math.random() < JUNK_RATE[r];
    const good = !gold && !junk && Math.random() < TARGET_RATE / (1 - JUNK_RATE[r]);
    const kind = gold ? 'gold' : junk ? 'junk' : good ? 'good' : 'bad';
    const wiggly = !gold && r >= 2 && Math.random() < WIGGLY_RATE;
    let h = LW;
    if (gold) { n.className = 'letter is-gold'; n.innerHTML = STAR; h = LW * .78; }
    else if (junk) { n.className = 'junk'; n.innerHTML = `<img src="${pick(JUNK)}" alt="">`; h = LW * 1.08; }
    else {
      const th = makeThing(good);
      if (th.shape) { n.className = 'item'; n.innerHTML = shapeSvg(th.shape, th.color.fill); h = LW * .92; }
      else { n.className = 'letter' + (wiggly ? ' is-wiggly' : ''); n.style.setProperty('--c', th.color.fill); h = LW * .68; }
    }
    const L = { el: n, kind, h, x: Math.random() * (W - LW), y: -LW * 1.1, tilt: (Math.random() - .5) * (junk ? 60 : 30), spin: junk ? (Math.random() - .5) * .12 : 0, sway: Math.random() * Math.PI * 2,
      amp: wiggly ? Math.min(W * .14, 70) : 14, swaySpeed: wiggly ? 300 : 600, sparkIn: 0, done: false };
    if (wiggly) L.x = LW + Math.random() * Math.max(0, W - LW * 3);
    sky.append(n); G.letters.push(L);
  }

  function sparkle(x, y) {
    const s = document.createElement('span'); s.className = 'spark';
    s.style.left = `${x + (Math.random() - .5) * LW * .8}px`; s.style.top = `${y}px`;
    sky.append(s); setTimeout(() => s.remove(), 650);
  }

  function frame(t) {
    if (!G.running) return;
    const dt = Math.min(50, t - (G.last || t)); G.last = t;
    const ramp = RAMP[G.round];
    G.spawnIn -= dt;
    if (G.spawnIn <= 0) { spawn(); G.spawnIn = GAP[speed] / ramp * (.8 + Math.random() * .4); }
    const fall = SPEED[speed] * ramp / 100 * H * dt;
    const left = G.bagX * (W - BW), rimY = H - CH * .9;   // 推車上緣
    for (const L of G.letters) {
      if (L.done) continue;
      L.y += fall * (L.kind === 'gold' ? .85 : 1); L.sway += dt / L.swaySpeed; L.tilt += L.spin * dt;
      const x = Math.max(0, Math.min(W - LW, L.x + Math.sin(L.sway) * L.amp));
      L.el.style.transform = `translate(${x}px,${L.y}px) rotate(${L.tilt + Math.sin(L.sway) * (L.amp > 14 ? 16 : 8)}deg)`;
      if (L.kind === 'gold' && (L.sparkIn -= dt) <= 0) { L.sparkIn = 110; sparkle(x + LW / 2 - 5, L.y); }
      const cx = x + LW / 2, bottom = L.y + L.h;
      if (bottom >= rimY + CH * .12 && bottom <= rimY + CH * .55 && cx > left + BW * .06 && cx < left + BW * .94) catchIt(L, cx);
      else if (L.y > H) { L.done = true; L.el.remove(); }
    }
    G.letters = G.letters.filter(L => !L.done);
    requestAnimationFrame(frame);
  }

  function floatText(text, x, cls = '') { const f = document.createElement('span'); f.className = `float ${cls}`; f.textContent = text; f.style.left = `${x - 20}px`; f.style.top = `${H - CH * 1.9}px`; sky.append(f); setTimeout(() => f.remove(), 900); }
  function bagAnim(cls) { [cart, iggy].forEach(el => { el.classList.remove('is-yes', 'is-no'); void el.offsetWidth; }); cart.classList.add(cls); if (cls === 'is-yes') iggy.classList.add('is-yes'); }

  let poseT;
  function pose(name, ms) { clearTimeout(poseT); $('courier').src = `assets/cast/iggy__${name}.webp`; if (ms) poseT = setTimeout(() => { $('courier').src = 'assets/cast/iggy__hello.webp'; }, ms); }

  function catchIt(L, cx) {
    L.done = true; L.el.remove();
    const need = ROUNDS[G.round];
    if (L.kind === 'good' || L.kind === 'gold') {
      const add = L.kind === 'gold' ? Math.min(2, need - G.got) : 1;
      G.got += add; syncCount(); bagAnim('is-yes');
      if (L.kind === 'gold') { Dino.sfx('stamp', .7); Dino.burst(cart); floatText('+2', cx, 'is-gold'); pose('cheer', 700); }
      else { Dino.sfx('pop', .6); floatText(G.got, cx); }
      play(NUM[G.got - 1]);
      if (G.got >= need) roundDone();
    } else {
      // 接錯退一格（已經是 0 就只晃一下）；奇怪物品讓伊奇皺眉
      G.wrong++; bagAnim('is-no'); Dino.sfx('wrong', .35); pose('busy_look', 650);
      if (G.got > 0) {
        const li = $('count').children[G.got - 1];
        G.got--; syncCount(); floatText('-1', cx, 'is-minus');
        li.classList.remove('is-lost'); void li.offsetWidth; li.classList.add('is-lost');
      }
    }
  }

  function later(fn, ms) { setTimeout(() => { if (G.paused) G.pending = fn; else fn(); }, ms); }

  function roundDone() {
    G.running = false; G.wrongs.push(G.wrong);
    Dino.sfx('correct', .8); Dino.burst(cart); pose('cheer');
    later(() => {
      G.letters.forEach(L => L.el.remove()); G.letters = [];
      G.round++;
      if (G.round >= ROUNDS.length) return finish();
      nextRound();
    }, 1500);
  }

  function showBanner(name) {
    const b = document.createElement('div'); b.className = 'banner';
    const t = document.createElement('span'), s = document.createElement('small');
    setKidText(t, name); setKidText(s, '變快了！'); b.append(t, s);
    sky.append(b); setTimeout(() => b.remove(), 1350);
  }

  function nextRound() {
    const mode = MODES[G.round], prev = G.target || {};
    const color = mode !== 'shape' ? pick(COLORS.filter(c => c !== prev.color)) : null;
    const shape = mode !== 'color' ? pick(SHAPES.filter(s => s !== prev.shape)) : null;
    G.target = { color, shape };
    G.pool = shape ? Dino.shuffle(SHAPES.filter(s => s !== shape)).slice(0, 3) : [];   // 本關的錯誤形狀只用 3 種，比較好分辨
    G.got = 0; G.wrong = 0; G.last = 0;
    pose('hello');
    setOrder();
    const name = ROUND_NAMES[G.round];
    if (name) { showBanner(name); Dino.sfx('swoosh', .5); }
    G.spawnIn = name ? 1300 : 600;   // 有關卡牌子時，等牌子收掉才開始掉
    G.running = true; requestAnimationFrame(frame);
  }

  function finish() {
    G.started = false;
    const clean = G.wrongs.filter(n => n === 0).length;
    const stars = clean >= 4 ? 3 : clean >= 2 ? 2 : 1;
    $('finishStars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('');
    $('finishActor').src = 'assets/cast/iggy__cheer.webp';
    $('finish').hidden = false; Dino.sfx('finish', .8); Dino.bgm.start();
  }

  function newGame() {
    G.round = 0; G.wrongs = []; G.target = null; G.started = true; G.paused = false; G.pending = null;
    G.letters.forEach(L => L.el.remove()); G.letters = [];
    measure(); nextRound();
  }

  // 暫停／繼續：⚙ 開始選單、? 玩法框打開時東西停在空中
  function pause() { if (!G.started || G.paused) return; G.paused = true; G.running = false; }
  function resume() {
    if (!G.paused) return;
    G.paused = false;
    if (G.pending) { const fn = G.pending; G.pending = null; fn(); return; }
    if (G.target && G.got < ROUNDS[G.round]) { G.last = 0; G.running = true; requestAnimationFrame(frame); }
  }

  // 玩法小框框：對的信掉進推車，襪子要閃開
  function buildHowto(stage) {
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent?.append(n); return n; };
    const svg = el('svg', { viewBox: '0 0 240 130', 'aria-hidden': 'true' }, stage);
    const grad = el('linearGradient', { id: 'hwSky', x1: 0, y1: 0, x2: 0, y2: 1 }, el('defs', {}, svg));
    el('stop', { offset: 0, 'stop-color': '#8fd0f2' }, grad); el('stop', { offset: 1, 'stop-color': '#e3f5fc' }, grad);
    el('rect', { width: 240, height: 130, fill: 'url(#hwSky)' }, svg);
    el('rect', { y: 118, width: 240, height: 12, fill: '#7cc46a' }, svg);
    const drop = (x, begin, draw) => {
      const g = el('g', {}, svg); draw(g);
      el('animateTransform', { attributeName: 'transform', type: 'translate', values: `${x} -14;${x} 92`, dur: '2.4s', begin, repeatCount: 'indefinite' }, g);
    };
    const env = fill => g => { el('rect', { x: -14, y: -10, width: 28, height: 19, rx: 4, fill, stroke: '#0004', 'stroke-width': 2 }, g); el('path', { d: 'M-13-9 0 2 13-9', fill: 'none', stroke: '#fff8', 'stroke-width': 2 }, g); };
    drop(70, '0s', env('#e8574a'));
    drop(170, '.8s', g => el('image', { href: JUNK[0], x: -15, y: -15, width: 30, height: 30, style: 'mix-blend-mode:multiply' }, g));
    drop(120, '1.6s', env('#e8574a'));
    const b = el('g', {}, svg);
    el('image', { href: 'assets/cast/iggy__hello.webp', x: -17, y: -46, width: 34, height: 44, preserveAspectRatio: 'xMidYMax meet' }, b);
    el('image', { href: 'assets/cast/prop_mail_cart_front.webp', x: -27, y: -14, width: 54, height: 36 }, b);
    el('animateTransform', { attributeName: 'transform', type: 'translate', values: '70 100;120 100;120 100;70 100', keyTimes: '0;.55;.72;1', dur: '2.4s', repeatCount: 'indefinite' }, b);
  }

  function syncPick() { document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.speed === speed))); }
  setKidText($('title'), '接信大郵袋'); setKidText($('startLabel'), '點一下，開始接信！');
  setKidText($('pSlow'), '慢'); setKidText($('pMid'), '中'); setKidText($('pFast'), '快');
  setKidText($('finishTitle'), '信都接到了！'); setKidText($('again'), '再玩一次'); setKidText($('home'), '回首頁');
  document.documentElement.classList.toggle('dino-mode', Dino.dinoMode());
  Dino.bgm.start(); Dino.menuTaps($('ready')); Dino.menuTaps($('finish'));
  document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { speed = b.dataset.speed; try { localStorage.setItem('dinopost-catch-speed', speed); } catch { /* ok */ } syncPick(); }));
  syncPick();
  $('ask').addEventListener('click', () => G.target && sayOrder());
  // 導演 2026-10-22：房子永遠回首頁；⚙ 遊戲中打開本遊戲的開始選單（東西先停住）
  document.querySelector('.dino-home').addEventListener('click', e => { e.preventDefault(); Dino.goTo('index.html'); });
  $('menuBtn').addEventListener('click', () => { if (!G.started || !$('ready').hidden) return; pause(); Dino.sfx('tap', .5); $('ready').hidden = false; Dino.bgm.start(); });
  $('help').addEventListener('click', () => { Dino.sfx('tap', .5); pause(); HW.show(); });
  let howtoSeen = false;
  $('start').addEventListener('click', () => {
    $('ready').hidden = true; Dino.bgm.stop();
    if (G.paused) return resume();
    if (!howtoSeen) { howtoSeen = true; G.waitHowto = true; HW.show(); return; }
    newGame();
  });
  $('again').addEventListener('click', () => { $('finish').hidden = true; Dino.bgm.stop(); newGame(); });
  addEventListener('resize', measure);
  measure();
  $('courier').src = 'assets/cast/iggy__hello.webp';
  const HW = Dino.howto({ preview: buildHowto, text: '奇怪東西不要接', kid: setKidText,
    onClose: () => { if (G.waitHowto) { G.waitHowto = false; newGame(); } else if ($('ready').hidden) resume(); } });
  window.__catch = G;
})();
</script>
