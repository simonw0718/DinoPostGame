<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#164d39">
  <meta name="apple-mobile-web-app-title" content="DINO單字任務">
  <title>注音輸送帶・恐龍郵局</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="belt.css"><link rel="stylesheet" href="dino-mode.css"><link rel="stylesheet" href="home-button.css"><link rel="stylesheet" href="game-header.css"><link rel="stylesheet" href="howto.css"><link rel="stylesheet" href="preview.css">
  <script src="shared.js" defer></script><script src="progress.js" defer></script><script src="belt.js" defer></script>
</head>
<body>
  <div class="zb-shell">
    <header class="gh">
      <a class="dino-home" href="index.html" aria-label="回選遊戲首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 1.6 11.4a1 1 0 0 0 1.3 1.5L4.5 11.6V20a1.5 1.5 0 0 0 1.5 1.5h3.8v-5.8a.7.7 0 0 1 .7-.7h3a.7.7 0 0 1 .7.7v5.8H18a1.5 1.5 0 0 0 1.5-1.5v-8.4l1.6 1.3a1 1 0 0 0 1.3-1.5Z"/></svg></a>
      <h1 id="title" class="gh-title">注音輸送帶</h1>
      <div class="gh-tools"><button id="helpButton" class="gh-btn" type="button" aria-label="玩法">?</button><button id="menuBtn" class="gh-btn" type="button" aria-label="速度選單"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg></button></div>
    </header>

    <section class="zb-host">
      <div id="actor" class="zb-actor"><img id="actorImg" alt=""></div>
      <p id="bubble" class="zb-bubble" role="status" aria-live="polite"></p>
      <ol id="progress" class="zb-progress" aria-label="進度"></ol>
    </section>

    <main class="zb-question">
      <div class="zb-picture">
        <span id="picture" class="zb-picture-art"></span>
        <button id="replay" class="zb-replay" type="button" aria-label="再聽一次">♫</button>
        <span id="doneMark" class="zb-done-mark" hidden><img src="assets/dinopost-workmark-stamp-transparent-v1.png" alt=""></span>
      </div>
      <div id="slots" class="zb-slots" aria-label="注音格子"></div>
    </main>

    <section id="belt" class="zb-belt" aria-label="注音輸送帶">
      <div id="beltTrack" class="zb-track"></div>
      <div class="zb-rollers" aria-hidden="true"></div>
    </section>
  </div>

  <div id="readyOverlay" class="ready-tap">
    <div class="ready-pick" role="group" aria-label="輸送帶速度"><button type="button" data-pick="0">慢</button><button type="button" data-pick="1">中</button><button type="button" data-pick="2">快</button></div>
    <button id="readyStart" class="ready-start" type="button" aria-label="點一下，開始拼注音">
      <span class="ready-go" aria-hidden="true"><span class="ready-ring"></span><span class="ready-ring r2"></span><span class="ready-icon">▶</span></span>
      <span id="readyTitle" class="ready-label">點一下，開始拼注音！</span>
    </button>
  </div>

  <div id="finishOverlay" class="finish-overlay" hidden>
    <div class="finish-card">
      <img id="finishActor" class="finish-actor" alt="">
      <h2 id="finishTitle">全部拼好了！</h2>
      <p id="finishStars" class="finish-stars"></p>
      <ol id="finishWords" class="finish-words"></ol>
      <div class="finish-actions"><button id="playAgain" type="button">再玩一次</button><a id="finishHome" href="index.html">回首頁</a></div>
    </div>
  </div>
</body>
</html>
